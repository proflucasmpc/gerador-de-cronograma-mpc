<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Plano de Estudos Personalizado MPC</title>
<style>
:root{--navy:#0D1B33;--navy2:#18365E;--navy3:#071225;--gold:#D7AE50;--cyan:#24C8FF;--purple:#8A5CFF;--blue:#4C7DFF;--green:#31B77A;--orange:#F0A23B;--bg:#F5F7FB;--paper:#fff;--text:#172033;--muted:#657086;--line:#E4E8F0;--track:#E9EDF4}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:0 24px 70px}.topbar{position:sticky;top:0;z-index:80;background:rgba(7,18,37,.98);border-bottom:3px solid var(--cyan)}.topbar-inner{max-width:1180px;margin:auto;height:72px;padding:0 24px;display:flex;align-items:center;gap:14px;color:#fff}.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--gold);display:grid;place-items:center;color:var(--navy3);font-weight:1000}.brand-copy{font-weight:900;line-height:1.1}.brand-copy small{display:block;color:#a9dff1;font-size:11px}.private-chip{margin-left:auto;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}.hero{margin:24px 0 26px;background:linear-gradient(135deg,var(--navy3),var(--navy2));color:#fff;border-radius:18px;border-bottom:5px solid var(--cyan);overflow:hidden}.hero-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:30px;padding:42px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:46px;line-height:1.05;margin:12px 0}.hero-sub{font-size:17px;max-width:720px;margin:0 0 22px;color:#eaf3ff}.student-name{font-family:Georgia,serif;font-size:28px;margin:0 0 10px}.meta{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:13px}.countdown{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:22px;align-self:center}.countdown strong{display:block;font-family:Georgia,serif;font-size:60px;line-height:1}.countdown span{font-size:13px;color:#eaf3ff}.section{margin:28px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;border-left:5px solid var(--cyan);padding-left:15px;margin-bottom:15px}.section-head h2{font-family:Georgia,serif;font-size:31px;line-height:1.08;margin:3px 0 0;color:var(--navy3)}.section-head p{margin:0;max-width:560px;color:var(--muted);font-size:13px}.panel,.metric,.day,.content{background:#fff;border:1px solid var(--line);border-radius:14px}.today-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.today{padding:24px}.today-title{display:flex;justify-content:space-between;gap:12px;margin-bottom:15px}.today-title strong{font-family:Georgia,serif;font-size:23px;color:var(--navy3)}.today-title span{color:var(--muted);font-size:12px}.task{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px}.task.done{border-color:var(--green);background:#F7FCF9}.task-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;color:#fff;font-size:10px;font-weight:900;text-transform:uppercase}.teoria{background:var(--cyan)}.exercicios{background:var(--purple)}.revisao{background:var(--green)}.simulado{background:var(--orange)}.estudo{background:var(--blue)}.task h3{font-size:16px;margin:10px 0 4px}.task p{margin:0;color:var(--muted);font-size:14px}.check{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer}.done .check{background:var(--green);color:#fff;border-color:var(--green)}.progress{padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center}.progress h3{font-family:Georgia,serif;font-size:24px;margin:0}.ring{--p:0;width:170px;height:170px;border-radius:50%;margin:24px auto;background:conic-gradient(var(--cyan) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:14px;background:#fff;border-radius:50%}.ring-inner{z-index:1}.ring-inner strong{display:block;font-family:Georgia,serif;font-size:36px}.ring-inner span{font-size:11px;color:var(--muted)}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:18px;border-top:4px solid var(--cyan)}.metric:nth-child(2n){border-top-color:var(--purple)}.metric strong{display:block;font-family:Georgia,serif;font-size:30px;color:var(--navy3)}.metric span{font-size:11px;text-transform:uppercase;font-weight:800;color:var(--muted)}.schedule{display:grid;gap:10px}.day{overflow:hidden;scroll-margin-top:90px}.day summary{cursor:pointer;list-style:none;background:var(--navy);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.day summary::-webkit-details-marker{display:none}.day summary strong{font-family:Georgia,serif;font-size:20px}.day summary span{font-size:11px;color:#e6ecf4}.day-body{padding:0}.schedule-task{display:grid;grid-template-columns:9px 1fr 34px;gap:11px;padding:14px 17px;border-bottom:1px solid var(--line);align-items:start}.schedule-task:last-child{border-bottom:0}.dot{width:8px;height:8px;border-radius:50%;margin-top:7px}.schedule-task strong{display:block;font-size:14px}.schedule-task small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.round{width:31px;height:31px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#a5afbb;cursor:pointer;font-weight:900}.round.done{background:var(--green);border-color:var(--green);color:#fff}.contents{display:grid;grid-template-columns:1fr 1fr;gap:10px}.content{overflow:hidden}.content summary{list-style:none;cursor:pointer;padding:14px 15px;display:flex;justify-content:space-between;gap:10px}.content summary::-webkit-details-marker{display:none}.content strong{font-size:14px;color:var(--navy3)}.content-list{border-top:1px solid var(--line);padding:8px 15px 13px;background:#F8FAFD}.content-item{padding:8px 0;border-bottom:1px solid var(--track);font-size:13px}.content-item:last-child{border:0}.content-item small{display:block;color:var(--muted);margin-top:4px}.state{width:min(520px,calc(100% - 28px));margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}.state h1{font-family:Georgia,serif;color:var(--navy3);font-size:30px}.code-input{width:100%;border:1px solid var(--line);border-radius:11px;padding:14px;text-align:center;letter-spacing:.18em;font-size:22px;font-weight:900;text-transform:uppercase;outline:none}.code-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(36,200,255,.14)}.activate{width:100%;margin-top:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;padding:14px;font-weight:900;cursor:pointer}.error{min-height:18px;color:#c44;font-size:12px;font-weight:800}.private-note{margin-top:16px;background:#F8FAFD;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--muted);font-size:12px}
@media(max-width:860px){.shell{padding:0 13px 45px}.topbar-inner{height:62px;padding:0 13px}.hero{margin-top:13px}.hero-grid{grid-template-columns:1fr;padding:28px 20px}.hero h1{font-size:36px}.countdown strong{font-size:48px}.today-grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}.section-head{display:block}.section-head p{margin-top:6px}.contents{grid-template-columns:1fr}}
@media(max-width:460px){.hero h1{font-size:32px}.metric-grid{grid-template-columns:1fr 1fr}.today{padding:18px}.progress{padding:18px}}
</style>
</head>
<body>
<div id="app"><div class="state"><h1>Carregando seu plano…</h1><p>Aguarde alguns segundos.</p></div></div>
<script>
(()=>{
'use strict';
const app=document.getElementById('app');
const parts=location.pathname.split('/').filter(Boolean);
const studentSlug=(parts[0]==='aluno'?String(parts[1]||'').toLowerCase():'').replace(/[^a-z0-9-]/g,'').slice(0,60);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dateObj=v=>{if(!v)return null;const d=new Date(v.includes('T')?v:`${v}T12:00:00`);return Number.isNaN(d.getTime())?null:d};
const pt=v=>{const d=dateObj(v);return d?d.toLocaleDateString('pt-BR'):'—'};
const long=v=>{const d=dateObj(v);return d?d.toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}):'—'};
const weekday=v=>{const d=dateObj(v);return d?d.toLocaleDateString('pt-BR',{weekday:'long'}):''};
const typeClass=v=>{const s=String(v||'').toLowerCase();if(s.includes('simulado'))return'simulado';if(s.includes('exerc')||s.includes('quest'))return'exercicios';if(s.includes('revis'))return'revisao';if(s.includes('teoria'))return'teoria';return'estudo'};
const cleanActivity=v=>String(v||'Atividade de estudo').replace(/^\s*(teoria|questões|questoes|exercícios|exercicios|revisão|revisao|simulado)\s*[:–—-]?\s*/i,'').trim();
const daysLeft=v=>{const e=dateObj(v);if(!e)return 0;const n=new Date();n.setHours(12,0,0,0);return Math.max(0,Math.ceil((e-n)/86400000))};
const daysBetween=(a,b)=>{const x=dateObj(a),y=dateObj(b);return x&&y?Math.max(1,Math.round((y-x)/86400000)+1):0};
function renderActivation(){
 const label=studentSlug?studentSlug.charAt(0).toUpperCase()+studentSlug.slice(1):'aluno';
 app.innerHTML=`<div class="state"><div class="brand-mark" style="margin:0 auto 14px">MPC</div><h1>Acesso ao cronograma de ${esc(label)}</h1><p>Digite o código de ativação recebido do Prof. Lucas MPC. Após a primeira ativação, este navegador continuará autorizado.</p><form id="activation"><input class="code-input" id="code" maxlength="20" autocomplete="one-time-code" placeholder="CÓDIGO DE ATIVAÇÃO"><button class="activate" type="submit">ATIVAR NESTE NAVEGADOR</button><p class="error" id="err"></p></form><div class="private-note">Este acesso é individual e fica vinculado ao navegador ativado.</div></div>`;
 const form=document.getElementById('activation'),input=document.getElementById('code'),err=document.getElementById('err');input?.focus();input?.addEventListener('input',()=>{input.value=input.value.toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,20);err.textContent=''});form?.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;b.textContent='VALIDANDO…';try{const r=await fetch('/api/student-access/activate',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({student:studentSlug,code:input.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Não foi possível ativar o acesso.');location.reload()}catch(ex){err.textContent=ex.message||'Código inválido.';b.disabled=false;b.textContent='ATIVAR NESTE NAVEGADOR'}})
}
async function load(){if(!studentSlug)throw new Error('Link do aluno inválido.');const r=await fetch(`/api/student-plan?student=${encodeURIComponent(studentSlug)}`,{cache:'no-store',credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Não foi possível abrir o cronograma.');e.code=d.code||'';throw e}return d}
function render(plan){
 document.title=`Plano de Estudos de ${plan.studentName||'Aluno'} · Professor Lucas MPC`;
 const tasks=[...(plan.tasks||[])].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.start||'').localeCompare(String(b.start||'')));
 const dated=tasks.filter(t=>t.date),start=plan.startDate||dated[0]?.date||'',exam=plan.examDate||plan.endDate||dated.at(-1)?.date||'';
 const byDate=new Map();tasks.forEach(t=>{const k=t.date||'sem-data';if(!byDate.has(k))byDate.set(k,[]);byDate.get(k).push(t)});
 const subjects=new Map();tasks.forEach(t=>{const s=t.subject||'Disciplina';if(!subjects.has(s))subjects.set(s,[]);subjects.get(s).push(t)});
 const syllabus=Array.isArray(plan.syllabus)?plan.syllabus.filter(s=>s?.name&&Array.isArray(s.topics)&&s.topics.length):[];
 const topicCount=syllabus.length?syllabus.reduce((n,s)=>n+s.topics.length,0):new Set(tasks.map(t=>`${t.subject}|${cleanActivity(t.activity)}`)).size;
 const simulations=tasks.filter(t=>typeClass(t.type)==='simulado').length,reviews=tasks.filter(t=>typeClass(t.type)==='revisao').length;
 const progressKey=`mpc-private-progress:${studentSlug}`;let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem(progressKey)||'[]'))}catch{}
 const keyFor=(t,i)=>t.id||`${t.date||'x'}-${t.subject||'s'}-${i}`;
 const todayKey=new Date().toISOString().slice(0,10),fallback=[...byDate.keys()].find(k=>k!=='sem-data')||'',todayDate=byDate.has(todayKey)?todayKey:fallback,todayTasks=byDate.get(todayDate)||[];
 app.innerHTML=`<header class="topbar"><div class="topbar-inner"><div class="brand-mark">MPC</div><div class="brand-copy">Professor Lucas MPC<small>Plano de Estudos Personalizado</small></div><span class="private-chip">ACESSO INDIVIDUAL</span></div></header><main class="shell"><section class="hero"><div class="hero-grid"><div><div class="eyebrow">Plano de Estudos MPC</div><h1>Seu Plano de Estudos Personalizado</h1><p class="hero-sub">Seu planejamento foi organizado para acompanhar a preparação até a prova, respeitando a rotina e o tempo disponível informados.</p><p class="student-name">${esc(plan.studentName||'Aluno')}</p><div class="meta"><span class="pill">${esc(plan.goal||'Objetivo de estudos')}</span><span class="pill">${esc(pt(start))} → ${esc(pt(exam))}</span><span class="pill">${Number(plan.hoursPerDay||0)===1?'1 hora':`${esc(plan.hoursPerDay||'—')} horas`} por dia</span></div></div><aside class="countdown"><div class="eyebrow">CONTAGEM REGRESSIVA</div><strong>${daysLeft(exam)}</strong><span>dias para a prova · ${esc(pt(exam))}</span></aside></div></section>${plan.generalGuidance?`<section class="section"><div class="section-head"><div><span class="eyebrow" style="color:var(--gold)">Orientações</span><h2>Direção para sua preparação</h2></div></div><div class="panel" style="padding:20px;white-space:pre-line">${esc(plan.generalGuidance)}</div></section>`:''}<section class="section"><div class="section-head"><div><span class="eyebrow" style="color:var(--gold)">Execução</span><h2>Hoje · ${esc(weekday(todayDate))}</h2></div><p>Marque as atividades concluídas para acompanhar seu progresso neste navegador.</p></div><div class="today-grid"><div class="panel today"><div class="today-title"><strong>${esc(long(todayDate))}</strong><span>${todayTasks.length} blocos programados</span></div>${todayTasks.map((t,i)=>{const k=keyFor(t,i);return`<article class="task ${done.has(k)?'done':''}" data-card="${esc(k)}"><div class="task-top"><span class="badge ${typeClass(t.type)}">${esc(t.type||'Estudo')}</span><button class="check" data-done="${esc(k)}">${done.has(k)?'Concluído':'Marcar concluído'}</button></div><h3>${esc(t.subject||'Disciplina')}</h3><p>${esc(cleanActivity(t.activity))}</p></article>`}).join('')||'<p>Nenhuma atividade programada para esta data.</p>'}</div><aside class="panel progress"><h3>Seu progresso</h3><div class="ring" id="ring"><div class="ring-inner"><strong id="pct">0%</strong><span>do plano</span></div></div><div class="private-note">As marcações ficam salvas somente neste navegador.</div></aside></div></section><section class="section"><div class="section-head"><div><span class="eyebrow" style="color:var(--gold)">Visão geral</span><h2>Seu plano em números</h2></div></div><div class="metric-grid"><div class="metric"><strong>${daysBetween(start,exam)}</strong><span>dias de planejamento</span></div><div class="metric"><strong>${subjects.size}</strong><span>matérias</span></div><div class="metric"><strong>${topicCount}</strong><span>tópicos</span></div><div class="metric"><strong>${tasks.length}</strong><span>atividades</span></div><div class="metric"><strong>${reviews}</strong><span>revisões</span></div><div class="metric"><strong>${simulations}</strong><span>simulados</span></div><div class="metric"><strong>${esc(plan.hoursPerDay||'—')}h</strong><span>por dia</span></div><div class="metric"><strong>${esc(pt(exam).slice(0,5))}</strong><span>data da prova</span></div></div></section><section class="section"><div class="section-head"><div><span class="eyebrow" style="color:var(--gold)">Execução completa</span><h2>Cronograma</h2></div><p>Abra cada data para visualizar os blocos programados.</p></div><div class="schedule">${[...byDate.entries()].filter(([d])=>d!=='sem-data').map(([date,items],di)=>`<details class="day" ${di===0?'open':''}><summary><div><span>${esc(weekday(date))}</span><br><strong>${esc(pt(date))}</strong></div><span>${items.length} blocos</span></summary><div class="day-body">${items.map((t,j)=>{const k=keyFor(t,`${date}-${j}`);return`<div class="schedule-task"><i class="dot ${typeClass(t.type)}"></i><div><span class="badge ${typeClass(t.type)}">${esc(t.type||'Estudo')}</span><strong>${esc(t.subject||'Disciplina')}${t.start?` · ${esc(t.start)}${t.end?`–${esc(t.end)}`:''}`:''}</strong><small>${esc(cleanActivity(t.activity))}</small></div><button class="round ${done.has(k)?'done':''}" data-done="${esc(k)}">✓</button></div>`}).join('')}</div></details>`).join('')}</div></section>${syllabus.length?`<section class="section"><div class="section-head"><div><span class="eyebrow" style="color:var(--gold)">Edital verticalizado</span><h2>Conteúdo programático</h2></div></div><div class="contents">${syllabus.map((s,i)=>`<details class="content"><summary><strong>${String(i+1).padStart(2,'0')} · ${esc(s.name)}</strong><span>＋</span></summary><div class="content-list">${s.topics.map(t=>`<div class="content-item"><strong>${esc(t.title)}</strong>${Array.isArray(t.subtopics)&&t.subtopics.length?`<small>${t.subtopics.map(esc).join('<br>')}</small>`:''}</div>`).join('')}</div></details>`).join('')}</div></section>`:''}</main>`;
 function refresh(){const pct=tasks.length?Math.round(done.size/tasks.length*100):0;const p=document.getElementById('pct'),r=document.getElementById('ring');if(p)p.textContent=pct+'%';if(r)r.style.setProperty('--p',pct);document.querySelectorAll('[data-done]').forEach(b=>{const k=b.dataset.done,on=done.has(k);b.classList.toggle('done',on);if(b.classList.contains('check'))b.textContent=on?'Concluído':'Marcar concluído';document.querySelector(`[data-card="${CSS.escape(k)}"]`)?.classList.toggle('done',on)});localStorage.setItem(progressKey,JSON.stringify([...done]))}
 document.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.done;done.has(k)?done.delete(k):done.add(k);refresh()}));refresh();
}
load().then(render).catch(err=>{if(err.code==='ACTIVATION_REQUIRED'){renderActivation();return}app.innerHTML=`<div class="state"><h1>Não foi possível abrir este cronograma</h1><p>${esc(err.message)}</p></div>`});
})();
</script>
</body>
</html>
