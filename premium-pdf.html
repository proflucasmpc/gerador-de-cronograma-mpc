<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Premium MPC</title>
<style>
:root{--navy:#0b1930;--navy2:#132a4b;--gold:#d5a72c;--gold2:#a97a10;--cyan:#35bee0;--purple:#7b5ce1;--teal:#2cbf9a;--orange:#f2a437;--off:#f7f6f1;--white:#fff;--text:#182234;--muted:#667085;--line:#d7dde5;--soft:#eef3f8;--softgold:#faf4e1}
*{box-sizing:border-box} html,body{margin:0;background:#dfe4eb;color:var(--text);font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:50;background:#081426;color:#fff;padding:12px 18px;display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 4px 16px #0003}.toolbar button,.toolbar a{border:0;border-radius:10px;padding:11px 16px;font-weight:800;text-decoration:none;cursor:pointer}.toolbar .primary{background:var(--gold);color:var(--navy)}.toolbar .secondary{background:#183052;color:#fff}.status{font-size:13px;color:#d4deeb}.document{padding:24px 0 60px}.pdf-page{width:210mm;min-height:297mm;margin:0 auto 18px;background:var(--off);position:relative;overflow:hidden;box-shadow:0 8px 30px #0002;page-break-after:always;padding:30mm 16mm 19mm}.pdf-page.dark{background:var(--navy);color:#fff}.page-header{position:absolute;left:0;right:0;top:0;height:31mm;background:var(--navy);padding:9mm 16mm 0;color:#fff}.eyebrow{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);font-weight:800}.page-title{font-family:Georgia,'Times New Roman',serif;font-size:25px;line-height:1.05;margin-top:5px;font-weight:700}.subtitle{font-size:10px;color:var(--muted);margin:8mm 0 5mm}.gold-bar{position:absolute;left:16mm;top:9mm;width:1.5mm;height:12mm;background:var(--gold)}.page-footer{position:absolute;left:16mm;right:16mm;bottom:8mm;border-top:1px solid var(--gold);padding-top:3mm;display:flex;justify-content:space-between;color:var(--muted);font-size:8px}.cover{padding:27mm 16mm 18mm;background:var(--navy)}.cover .brand{color:var(--cyan);font-weight:800;font-size:11px}.cover h1{font-family:Georgia,'Times New Roman',serif;font-size:38px;line-height:1.04;margin:24mm 0 0;color:#fff}.cover h1 span{color:var(--cyan)}.cover .goal-label{margin-top:15mm;color:var(--gold);font-weight:800;font-size:10px}.cover .goal{font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.15;margin-top:3mm}.cover-card{position:absolute;left:16mm;right:16mm;bottom:42mm;border:1px solid #2d466b;background:var(--navy2);border-radius:14px;padding:8mm}.cover-card small{color:var(--cyan);font-weight:800}.cover-card strong{display:block;font-family:Georgia,'Times New Roman',serif;font-size:20px;margin:3mm 0;color:#fff}.cover-card em{font-style:normal;color:var(--gold);font-weight:800;font-size:10px}.badge{position:absolute;right:16mm;top:20mm;background:var(--gold);color:var(--navy);border-radius:999px;padding:5mm 7mm;font-weight:900;font-size:10px}.toc-row{display:grid;grid-template-columns:10mm 1fr 18mm;gap:3mm;align-items:center;padding:5mm 0;border-bottom:1px solid var(--line)}.toc-row .n{color:var(--gold2);font-weight:900;font-size:10px}.toc-row .t{font-family:Georgia,'Times New Roman',serif;font-size:15px;font-weight:700}.toc-row .p{text-align:right;color:var(--muted);font-weight:800}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:4mm}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6mm}.metric strong{display:block;font-family:Georgia,'Times New Roman',serif;font-size:25px;color:var(--navy)}.metric span{font-size:8px;text-transform:uppercase;color:var(--muted);font-weight:800}.callout{background:var(--softgold);border:1px solid var(--gold);border-radius:12px;padding:6mm;margin-top:7mm}.callout strong{font-family:Georgia,'Times New Roman',serif;font-size:15px;color:var(--navy)}.bar-row{display:grid;grid-template-columns:55mm 1fr 18mm;gap:3mm;align-items:center;margin:4mm 0}.bar-row .name{font-size:8px;font-weight:800}.bar{height:4mm;background:var(--soft);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan);border-radius:inherit}.bar-row .count{text-align:right;color:var(--muted);font-size:8px;font-weight:800}.subject-head{font-family:Georgia,'Times New Roman',serif;font-size:18px;color:var(--navy);font-weight:700;margin-bottom:2mm}.subject-meta{font-size:8px;color:var(--gold2);font-weight:900;text-transform:uppercase;margin-bottom:5mm}.topic{margin:0 0 4mm;padding-left:3mm;border-left:2px solid var(--gold)}.topic strong{display:block;font-size:9px}.topic ul{margin:2mm 0 0 4mm;padding-left:4mm;color:var(--muted);font-size:8px;line-height:1.45}.strategy-card{display:grid;grid-template-columns:13mm 1fr;gap:5mm;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5mm;margin-bottom:4mm}.strategy-card b.num{display:grid;place-items:center;width:11mm;height:11mm;background:var(--navy);color:var(--gold);border-radius:50%;font-size:9px}.strategy-card h3{font-family:Georgia,'Times New Roman',serif;margin:0 0 2mm;font-size:15px;color:var(--navy)}.strategy-card p{margin:0;color:var(--muted);font-size:9px;line-height:1.5}.legend{display:grid;gap:4mm}.legend-row{display:grid;grid-template-columns:32mm 1fr;gap:5mm;align-items:center}.pill{display:inline-flex;align-items:center;justify-content:center;height:8mm;padding:0 5mm;border-radius:999px;color:#fff;font-size:8px;font-weight:900}.pill.teoria{background:var(--cyan)}.pill.exercicios{background:var(--purple)}.pill.revisao{background:var(--teal)}.pill.simulado{background:var(--orange);color:var(--navy)}.day-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:5mm}.day-head{background:var(--navy);color:#fff;padding:5mm 6mm;display:flex;justify-content:space-between;align-items:center}.day-head small{display:block;color:var(--cyan);font-size:8px;font-weight:900;text-transform:uppercase}.day-head strong{font-family:Georgia,'Times New Roman',serif;font-size:20px}.day-head em{font-style:normal;color:var(--gold);font-size:8px;font-weight:900}.task{display:grid;grid-template-columns:31mm 1fr;gap:5mm;padding:5mm 6mm;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task-title{font-weight:900;font-size:9px;margin-bottom:2mm}.task-desc{font-size:8px;color:var(--muted);line-height:1.45}.checklist{display:grid;gap:5mm}.check{display:grid;grid-template-columns:7mm 1fr;gap:4mm;align-items:start}.box{width:5mm;height:5mm;border:1px solid var(--gold);margin-top:1mm}.close-card{background:var(--navy2);border:1px solid #2d466b;border-radius:14px;padding:8mm;margin-top:22mm}.close-card a{color:var(--cyan);font-weight:800;text-decoration:none}.error{width:min(720px,92vw);margin:60px auto;background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 40px #0002}.error h1{color:var(--navy)}
@page{size:A4;margin:0}@media print{html,body{background:#fff}.toolbar{display:none!important}.document{padding:0}.pdf-page{box-shadow:none;margin:0;width:210mm;height:297mm;min-height:297mm;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}.error{display:none}}
@media(max-width:900px){.document{transform-origin:top center}.pdf-page{width:94vw;min-height:133vw;padding-left:7vw;padding-right:7vw}.page-header{padding-left:7vw;padding-right:7vw}.page-footer{left:7vw;right:7vw}.cover{padding-left:7vw;padding-right:7vw}.cover-card{left:7vw;right:7vw}.badge{right:7vw}.gold-bar{left:7vw}}
</style>
</head>
<body>
<div class="toolbar"><a class="secondary" href="./?admin=1">← Voltar ao gerador</a><button class="primary" id="printBtn">SALVAR COMO PDF PREMIUM</button><span class="status" id="status">Carregando cronograma...</span></div>
<div class="document" id="document"></div>
<script>
(()=>{
'use strict';
const STORAGE_KEY='geradorCronogramaMpcData';
const root=document.getElementById('document'),status=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ptDate=v=>{if(!v)return'';const d=new Date(v.includes('T')?v:`${v}T12:00:00`);return Number.isNaN(d)?v:d.toLocaleDateString('pt-BR')};
const parseActivity=activity=>{const a=String(activity||'');const m=a.match(/^(Teoria|Exercícios|Revisão)\s*-\s*(.*)$/i);const type=m?m[1]:'Estudo';const rest=m?m[2]:a;const x=rest.match(/Tópico:\s*(.*?)\s*\|\s*Subtópico:\s*(.*)$/i);return{type,topic:x?x[1].trim():rest.trim(),subtopic:x?x[2].trim():''}};
const dow=t=>{const d=new Date(`${t.date}T12:00:00`);return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][d.getDay()]};
const monthShort=d=>['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'][d.getMonth()];
const page=(cls='',inner='')=>`<section class="pdf-page ${cls}">${inner}</section>`;
const footer=(n,total)=>`<div class="page-footer"><span>Gerador de Cronograma MPC · Prof. Lucas MPC</span><span>${String(n).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span></div>`;
const header=(ey,title,sub,n,total)=>`<div class="page-header"><div class="gold-bar"></div><div class="eyebrow">${esc(ey)}</div><div class="page-title">${esc(title)}</div></div><div class="subtitle">${esc(sub)}</div>${footer(n,total)}`;
function getState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}}
const state=getState();
if(!state||!Array.isArray(state.tasks)||!state.tasks.length){root.innerHTML=`<div class="error"><h1>Nenhum cronograma encontrado</h1><p>Abra o Gerador MPC neste mesmo navegador, gere ou carregue o cronograma do aluno e depois volte a esta página.</p><p><a href="./?admin=1">Abrir área administrativa</a></p></div>`;status.textContent='Nenhum cronograma salvo neste navegador.';return}
const tasks=[...state.tasks].filter(t=>t&&t.date).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.start||'').localeCompare(String(b.start||'')));
const student=state.studentName||'Aluno';const goal=state.goal||'Objetivo não informado';const personalization=state.adminPersonalization||{};const examDate=personalization.examDate||state.examDate||'';
const studyTasks=tasks.filter(t=>!String(t.type||'').toLowerCase().includes('simulado'));const sims=tasks.filter(t=>String(t.type||'').toLowerCase().includes('simulado'));
const byDate=new Map();tasks.forEach(t=>{if(!byDate.has(t.date))byDate.set(t.date,[]);byDate.get(t.date).push(t)});
const subjectMap=new Map();studyTasks.forEach(t=>{const p=parseActivity(t.activity);const s=t.subject||'Disciplina';if(!subjectMap.has(s))subjectMap.set(s,new Map());if(!subjectMap.get(s).has(p.topic))subjectMap.get(s).set(p.topic,new Set());if(p.subtopic)subjectMap.get(s).get(p.topic).add(p.subtopic)});
const subjects=[...subjectMap.keys()];const uniqueTopics=[...subjectMap.values()].reduce((n,m)=>n+m.size,0);const uniqueSubtopics=[...subjectMap.values()].reduce((n,m)=>n+[...m.values()].reduce((a,s)=>a+s.size,0),0);const reviews=studyTasks.filter(t=>String(t.type||'').toLowerCase().includes('revis'));
const start=personalization.startDate||tasks[0]?.date||'';const end=personalization.endDate||tasks.at(-1)?.date||'';const d1=new Date(`${start}T12:00:00`),d2=new Date(`${end}T12:00:00`);const planDays=(!Number.isNaN(d1)&&!Number.isNaN(d2))?Math.round((d2-d1)/86400000)+1:(personalization.planDays||0);
const subjectCounts=new Map();studyTasks.forEach(t=>subjectCounts.set(t.subject,(subjectCounts.get(t.subject)||0)+1));const maxSubject=Math.max(1,...subjectCounts.values());
const contentPages=subjects.length;const schedulePages=byDate.size;const total=12+contentPages+schedulePages;let pn=1;let html='';
html+=page('cover dark',`<div class="badge">PREMIUM MPC</div><div class="brand">PROFESSOR LUCAS MPC</div><h1>Cronograma de Estudos<br><span>Personalizado</span></h1><div class="goal-label">PREPARAÇÃO PARA</div><div class="goal">${esc(goal)}</div><div class="cover-card"><small>PLANO EXCLUSIVO PARA</small><strong>${esc(student)}</strong><em>${esc(ptDate(start))} → ${esc(examDate?ptDate(examDate):ptDate(end))}</em></div>`);pn++;
const contentStart=5,scheduleIntro=7+contentPages,scheduleStart=scheduleIntro+1,reviewsPage=scheduleStart+schedulePages,simsPage=reviewsPage+1,finalPage=simsPage+1,examPage=finalPage+1;
html+=page('',header('Navegação','Sumário do plano','Um documento pensado como livro: capítulos claros e consulta rápida.',pn,total)+[['Seu plano em números',3],['Raio-X do conteúdo',4],['Mapa de matérias e conteúdos',contentStart],['Estratégia personalizada',5+contentPages],['Jornada até a prova',6+contentPages],['Cronograma de execução',scheduleIntro],['Plano de revisões',reviewsPage],['Estratégia de simulados',simsPage],['Reta final',finalPage],['Dia da prova',examPage]].map((x,i)=>`<div class="toc-row"><div class="n">${String(i+1).padStart(2,'0')}</div><div class="t">${esc(x[0])}</div><div class="p">${String(x[1]).padStart(2,'0')}</div></div>`).join(''));pn++;
const metrics=[[planDays,'dias de planejamento'],[subjects.length,'matérias'],[uniqueTopics,'tópicos únicos'],[uniqueSubtopics,'subtópicos únicos'],[(state.hoursPerDay||0)+'h','disponibilidade diária'],[sims.length,'simulados completos'],[reviews.length,'blocos de revisão'],[tasks.length,'atividades programadas']];
html+=page('',header('Capítulo 01','Seu plano em números','A dimensão real da preparação organizada para '+goal+'.',pn,total)+`<div class="metrics">${metrics.map(m=>`<div class="metric"><strong>${esc(m[0])}</strong><span>${esc(m[1])}</span></div>`).join('')}</div><div class="callout"><strong>${tasks.length} atividades organizadas em ${planDays||'todo o período'} dias de preparação.</strong></div>`);pn++;
html+=page('',header('Capítulo 02','Raio-X do conteúdo','Distribuição das matérias pelo volume de atividades programadas.',pn,total)+[...subjectCounts.entries()].sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<div class="bar-row"><div class="name">${esc(s)}</div><div class="bar"><i style="width:${Math.max(3,n/maxSubject*100)}%"></i></div><div class="count">${n} blocos</div></div>`).join('')+`<div class="callout"><strong>${subjects.length} matérias · ${uniqueTopics} tópicos · ${uniqueSubtopics} subtópicos</strong></div>`);pn++;
subjects.forEach(s=>{const mp=subjectMap.get(s);const subs=[...mp.values()].reduce((a,set)=>a+set.size,0);html+=page('',header('Capítulo 03','Mapa de matérias e conteúdos','Tópicos e subtópicos identificados no planejamento.',pn,total)+`<div class="subject-head">${esc(s)}</div><div class="subject-meta">${mp.size} tópicos · ${subs} subtópicos</div>${[...mp.entries()].map(([topic,set])=>`<div class="topic"><strong>${esc(topic||'Conteúdo')}</strong>${set.size?`<ul>${[...set].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`).join('')}`);pn++});
const strategy=[['01','Conteúdo novo','Teoria distribuída ao longo do período, sem concentrar uma disciplina no final.'],['02','Questões','Exercícios transformam leitura em aplicação e ajudam a identificar lacunas.'],['03','Revisões','Retomadas estratégicas reforçam retenção e reduzem esquecimento.'],['04','Simulados',`${sims.length} simulados funcionam como marcos de avaliação da preparação.`]];
html+=page('',header('Capítulo 04','Estratégia personalizada','Como o plano conduz estudo, prática, revisão e simulação.',pn,total)+strategy.map(x=>`<div class="strategy-card"><b class="num">${x[0]}</b><div><h3>${x[1]}</h3><p>${esc(x[2])}</p></div></div>`).join('')+`<div class="callout"><strong>Siga a sequência, marque o que foi concluído e use os simulados para descobrir o que precisa voltar à revisão.</strong></div>`);pn++;
html+=page('',header('Capítulo 05','Sua jornada até a prova','Do primeiro bloco ao dia da prova.',pn,total)+`<div class="strategy-card"><b class="num">01</b><div><h3>Início · ${esc(ptDate(start))}</h3><p>Construção da base e primeiros blocos de execução.</p></div></div><div class="strategy-card"><b class="num">02</b><div><h3>Consolidação</h3><p>Teoria, exercícios, revisões e simulados ao longo do período.</p></div></div><div class="strategy-card"><b class="num">03</b><div><h3>Reta final</h3><p>Redução de improviso e foco nos pontos-chave.</p></div></div><div class="strategy-card"><b class="num">04</b><div><h3>Prova · ${esc(ptDate(examDate))}</h3><p>Momento de executar o que foi construído.</p></div></div>`);pn++;
html+=page('',header('Capítulo 06','Cronograma de execução','Cada dia recebe uma página própria para preservar a leitura.',pn,total)+`<div class="legend"><div class="legend-row"><span class="pill teoria">TEORIA</span><span>Contato principal com o conteúdo.</span></div><div class="legend-row"><span class="pill exercicios">EXERCÍCIOS</span><span>Aplicação e treinamento por assunto.</span></div><div class="legend-row"><span class="pill revisao">REVISÃO</span><span>Retomada estratégica.</span></div><div class="legend-row"><span class="pill simulado">SIMULADO</span><span>Avaliação completa da preparação.</span></div></div><div class="callout"><strong>Nenhum conteúdo é reduzido até ficar ilegível. A diagramação prioriza leitura, não economia de páginas.</strong></div>`);pn++;
for(const [date,items] of byDate.entries()){const d=new Date(`${date}T12:00:00`);html+=page('',header('Cronograma',`Execução diária · ${ptDate(date)}`,'Conteúdo preservado do cronograma salvo no Gerador MPC.',pn,total)+`<div class="day-card"><div class="day-head"><div><small>${esc(dow({date}))}</small><strong>${String(d.getDate()).padStart(2,'0')} ${monthShort(d)}</strong></div><em>${items.length} blocos</em></div>${items.map(t=>{const p=parseActivity(t.activity);let typ=String(t.type||p.type||'Estudo').toLowerCase();if(typ.includes('simulado'))typ='simulado';else if(typ.includes('exerc'))typ='exercicios';else if(typ.includes('revis'))typ='revisao';else typ='teoria';return`<div class="task"><div><span class="pill ${typ}">${esc(String(t.type||p.type||'Estudo').toUpperCase())}</span></div><div><div class="task-title">${esc(t.subject||'Disciplina')}</div><div class="task-desc">${esc(t.activity||p.topic||'Atividade de estudo')}</div></div></div>`}).join('')}</div>`);pn++}
const revBy=new Map();reviews.forEach(t=>revBy.set(t.subject,(revBy.get(t.subject)||0)+1));html+=page('',header('Capítulo 07','Plano de revisões','Onde o planejamento volta ao conteúdo para fortalecer retenção.',pn,total)+`<div class="callout"><strong>${reviews.length} blocos de revisão programados.</strong></div>${reviews.length?[...revBy.entries()].map(([s,n])=>`<div class="bar-row"><div class="name">${esc(s)}</div><div class="bar"><i style="width:${Math.max(8,n/Math.max(...revBy.values())*100)}%;background:var(--teal)"></i></div><div class="count">${n}</div></div>`).join(''):'<p>O cronograma atual não possui atividades classificadas explicitamente como revisão.</p>'}`);pn++;
html+=page('',header('Capítulo 08','Estratégia de simulados',`${sims.length} marcos de avaliação distribuídos no período.`,pn,total)+`<div class="metrics">${sims.map(t=>`<div class="metric"><strong style="font-size:17px;color:var(--orange)">${esc(ptDate(t.date))}</strong><span>simulado completo</span></div>`).join('')}</div>`);pn++;
const finalDays=[];if(examDate){const e=new Date(`${examDate}T12:00:00`);for(let i=7;i>=1;i--){const d=new Date(e);d.setDate(e.getDate()-i);const k=d.toISOString().slice(0,10);finalDays.push([k,byDate.get(k)||[]])}}
html+=page('',header('Capítulo 09','Reta final','Os últimos dias devem reduzir improviso e aumentar clareza.',pn,total)+finalDays.map(([d,it])=>`<div class="strategy-card"><b class="num">${esc(ptDate(d).slice(0,5))}</b><div><h3>${it.length?esc([...new Set(it.map(x=>x.type||'Estudo'))].join(' · ')):'Descanso / organização'}</h3><p>${it.length?esc([...new Set(it.map(x=>x.subject))].join(' · ')):'Preservar energia, sono e logística.'}</p></div></div>`).join('')+`<div class="callout"><strong>Na reta final, qualidade vale mais que volume.</strong></div>`);pn++;
html+=page('',header('Capítulo 10','Dia da prova',examDate?ptDate(examDate):'Data não informada',pn,total)+`<div style="font-family:Georgia,serif;font-size:38px;color:var(--navy);margin:15mm 0 4mm">${examDate?ptDate(examDate).slice(0,2):'PROVA'}</div><div class="checklist">${['Documento de identificação e itens exigidos no edital','Conferir local e horário com antecedência','Planejar deslocamento e margem para imprevistos','Alimentação e hidratação organizadas','Evitar revisão pesada no último momento'].map(x=>`<div class="check"><span class="box"></span><span>${esc(x)}</span></div>`).join('')}</div><div class="callout"><strong>Seu trabalho agora é executar.</strong></div>`);pn++;
html+=page('dark',`<div class="brand" style="color:var(--cyan);font-weight:800">PROFESSOR LUCAS MPC</div><h1 style="font-family:Georgia,serif;font-size:30px;margin-top:28mm">Planejamento pronto.<br>Agora é execução.</h1><p style="color:#c9d3e1;max-width:150mm;line-height:1.6">Este documento foi gerado a partir do cronograma salvo no Gerador MPC.</p><div class="close-card"><div style="color:var(--gold);font-weight:900;font-size:9px">GERADOR DE CRONOGRAMA MPC</div><h2 style="font-family:Georgia,serif">Crie gratuitamente seu próprio planejamento.</h2><a href="./">gerador-de-cronograma-mpc.netlify.app</a></div>`);pn++;
root.innerHTML=html;status.textContent=`${tasks.length} atividades · ${total} páginas no modo Premium`;
document.getElementById('printBtn').addEventListener('click',()=>window.print());
})();
</script>
</body>
</html>
