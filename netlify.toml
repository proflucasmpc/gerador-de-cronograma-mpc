[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/acesso.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/area-usuario.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/area-usuario-preview.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/premium-pdf.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Fluxo do cliente desativado: novos e antigos visitantes não montam o cronograma sozinhos.
[[redirects]]
  from = "/acesso.html"
  to = "/cronograma-de-estudos-para-concurso"
  status = 302
  force = true

