[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/acesso.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/area-usuario.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/area-usuario-preview.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/premium-pdf.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/cronograma-de-estudos-para-concurso"
  to = "/cronograma-de-estudos-para-concurso.html"
  status = 200

[[redirects]]
  from = "/como-montar-cronograma-de-estudos-para-concurso"
  to = "/como-montar-cronograma-de-estudos-para-concurso.html"
  status = 200

[[redirects]]
  from = "/cronograma-de-estudos-para-quem-trabalha"
  to = "/cronograma-de-estudos-para-quem-trabalha.html"
  status = 200

[[redirects]]
  from = "/plano-de-estudos-a-partir-do-edital"
  to = "/plano-de-estudos-a-partir-do-edital.html"
  status = 200

[[redirects]]
  from = "/plano/*"
  to = "/plano.html"
  status = 200
