[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/acesso.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/area-usuario.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/area-usuario-preview.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/premium-pdf.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Migração permanente: qualquer URL antiga do subdomínio Netlify mantém o mesmo caminho no domínio definitivo.
[[redirects]]
  from = "https://gerador-de-cronograma-mpc.netlify.app/*"
  to = "https://lucasmpc.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://gerador-de-cronograma-mpc.netlify.app/*"
