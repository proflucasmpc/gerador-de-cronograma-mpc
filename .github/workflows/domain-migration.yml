name: Migracao Lucas MPC

on:
  push:
    branches:
      - migracao-lucasmpc-20260917

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar migracao de dominio e SEO
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          OLD = 'https://gerador-de-cronograma-mpc.netlify.app'
          NEW = 'https://lucasmpc.com.br'

          # 1) Troca global do domínio antigo pelo domínio definitivo em arquivos-texto.
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if OLD in text:
                  p.write_text(text.replace(OLD, NEW), encoding='utf-8')

          # 2) Nova home institucional do domínio guarda-chuva Lucas MPC.
          portal = r'''<!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>Lucas MPC | Concursos, Estudos e Ferramentas</title>
          <meta name="description" content="Portal Lucas MPC: cronogramas personalizados, guias de estudo para concursos, materiais e ferramentas para organizar sua preparação.">
          <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
          <link rel="canonical" href="https://lucasmpc.com.br/">
          <meta property="og:type" content="website">
          <meta property="og:title" content="Lucas MPC | Concursos, Estudos e Ferramentas">
          <meta property="og:description" content="Cronogramas personalizados, guias de estudo e ferramentas para organizar sua preparação para concursos.">
          <meta property="og:url" content="https://lucasmpc.com.br/">
          <meta name="theme-color" content="#071225">
          <script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Prof. Lucas MPC","url":"https://lucasmpc.com.br/","jobTitle":"Professor de Matemática"}</script>
          <style>
          :root{--navy:#071225;--navy2:#102541;--cyan:#24c8ff;--gold:#d7ae50;--green:#25d366;--bg:#f4f7fb;--text:#172033;--muted:#667085;--line:#dfe6ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.6}a{text-decoration:none;color:inherit}.wrap{width:min(1080px,calc(100% - 30px));margin:auto}.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--cyan)}.top .wrap{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:950}.brand small{display:block;color:#80e8f4;font-size:11px;letter-spacing:.1em}.wa{background:var(--green);color:#07351e;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:950}.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:76px 0}.hero h1{font-family:Georgia,serif;font-size:clamp(42px,7vw,68px);line-height:1.02;margin:10px 0 18px}.hero p{max-width:760px;color:#d7e2ee;font-size:18px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-block;border-radius:11px;padding:14px 18px;font-weight:950}.primary{background:var(--cyan);color:var(--navy)}.secondary{background:#fff;color:var(--navy)}.section{padding:58px 0}.section h2{font-family:Georgia,serif;color:var(--navy);font-size:38px;line-height:1.1;margin:8px 0 14px}.lead{color:var(--muted);max-width:820px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--cyan);border-radius:15px;padding:22px}.card:nth-child(2){border-top-color:var(--gold)}.card:nth-child(3){border-top-color:var(--green)}.card h3{margin:0 0 8px;color:var(--navy)}.card p{color:var(--muted);margin:0 0 16px}.card a{font-weight:900;color:#145f82}.footer{background:#030915;color:#9aacbf;text-align:center;padding:28px;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{padding:52px 0}.top .wrap{min-height:64px}.wa{font-size:11px}}
          </style>
          </head>
          <body>
          <header class="top"><div class="wrap"><div class="brand"><small>PROF. LUCAS MPC</small>Lucas MPC</div><a class="wa" href="https://wa.me/5511960189699">FALAR NO WHATSAPP</a></div></header>
          <main>
          <section class="hero"><div class="wrap"><div class="eyebrow">Estudos • Concursos • Ferramentas</div><h1>Organização para estudar melhor e avançar com clareza.</h1><p>O lucasmpc.com.br reúne os projetos do Prof. Lucas MPC: cronogramas personalizados, guias gratuitos e ferramentas voltadas à preparação para concursos.</p><div class="actions"><a class="btn primary" href="/cronograma-de-estudos-para-concurso">QUERO UM CRONOGRAMA PERSONALIZADO</a><a class="btn secondary" href="/guias-de-estudo-para-concursos">VER GUIAS DE ESTUDO</a></div></div></section>
          <section class="section"><div class="wrap"><div class="eyebrow">Comece por aqui</div><h2>Recursos para organizar sua preparação</h2><p class="lead">Escolha o caminho que mais combina com o que você precisa neste momento.</p><div class="grid">
          <article class="card"><h3>Cronograma personalizado</h3><p>Você informa edital, rotina, disponibilidade e data da prova. O planejamento é organizado para você.</p><a href="/cronograma-de-estudos-para-concurso">Conhecer o cronograma →</a></article>
          <article class="card"><h3>Por que estudar com cronograma?</h3><p>Entenda de forma prática como o planejamento ajuda a distribuir matérias, revisões e exercícios até a prova.</p><a href="/vantagens-de-estudar-com-cronograma">Ler o guia →</a></article>
          <article class="card"><h3>Guias para concursos</h3><p>Conteúdos sobre edital, rotina de estudos, 2 horas por dia, escala 12x36 e organização das matérias.</p><a href="/guias-de-estudo-para-concursos">Explorar os guias →</a></article>
          </div></div></section>
          </main>
          <footer class="footer">Prof. Lucas MPC · lucasmpc.com.br</footer>
          </body>
          </html>'''
          # remove indent introduced by YAML block for cleaner HTML
          portal = '\n'.join(line[10:] if line.startswith('          ') else line for line in portal.splitlines()) + '\n'
          Path('index.html').write_text(portal, encoding='utf-8')

          # 3) Robots definitivo.
          robots = '''User-agent: *
          Allow: /
          Disallow: /admin.html
          Disallow: /acesso.html
          Disallow: /area-usuario.html
          Disallow: /area-usuario-preview.html
          Disallow: /premium-pdf.html
          Disallow: /.netlify/

          Sitemap: https://lucasmpc.com.br/sitemap.xml
          '''
          robots = '\n'.join(line[10:] if line.startswith('          ') else line for line in robots.splitlines()) + '\n'
          Path('robots.txt').write_text(robots, encoding='utf-8')

          # 4) Sitemap completo no novo domínio, mantendo as URLs públicas estáveis.
          urls = [
              ('/', '1.0'),
              ('/cronograma-de-estudos-para-concurso', '1.0'),
              ('/guias-de-estudo-para-concursos', '0.9'),
              ('/vantagens-de-estudar-com-cronograma', '0.9'),
              ('/plano-de-estudos-a-partir-do-edital', '0.9'),
              ('/gerador-de-cronograma-de-estudos-para-concurso', '0.9'),
              ('/como-montar-cronograma-de-estudos-para-concurso', '0.8'),
              ('/cronograma-de-estudos-para-quem-trabalha', '0.8'),
              ('/cronograma-de-estudos-2-horas-por-dia', '0.8'),
              ('/como-dividir-materias-do-edital', '0.8'),
              ('/cronograma-de-estudos-12x36', '0.8'),
          ]
          parts = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for path, priority in urls:
              loc = 'https://lucasmpc.com.br' + path
              parts += ['  <url>', f'    <loc>{loc}</loc>', '    <lastmod>2026-09-17</lastmod>', '    <changefreq>weekly</changefreq>', f'    <priority>{priority}</priority>', '  </url>']
          parts.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(parts) + '\n', encoding='utf-8')

          # 5) Página nova de vantagens: canonical, Open Graph e URL limpa.
          adv = Path('vantagens-de-estudar-com-cronograma.html')
          if adv.exists():
              t = adv.read_text(encoding='utf-8')
              if 'rel="canonical"' not in t:
                  needle = '<meta name="theme-color" content="#071225">'
                  insert = '''<meta name="theme-color" content="#071225">
          <link rel="canonical" href="https://lucasmpc.com.br/vantagens-de-estudar-com-cronograma">
          <meta property="og:type" content="article">
          <meta property="og:title" content="Vantagens de Estudar com Cronograma para Concurso | Prof. Lucas MPC">
          <meta property="og:description" content="Entenda como um cronograma pode organizar matérias, revisões e exercícios até a prova.">
          <meta property="og:url" content="https://lucasmpc.com.br/vantagens-de-estudar-com-cronograma">'''
                  t = t.replace(needle, insert)
              adv.write_text(t, encoding='utf-8')

          # 6) Rota limpa da página nova sem alterar as rotas já existentes.
          nf = Path('netlify.toml')
          text = nf.read_text(encoding='utf-8')
          if 'from = "/vantagens-de-estudar-com-cronograma"' not in text:
              text += '''
          [[redirects]]
            from = "/vantagens-de-estudar-com-cronograma"
            to = "/vantagens-de-estudar-com-cronograma.html"
            status = 200
          '''
          text = '\n'.join(line[10:] if line.startswith('          ') else line for line in text.splitlines()) + '\n'
          nf.write_text(text, encoding='utf-8')

          # O workflow é temporário e não será levado para a main.
          wf = Path('.github/workflows/domain-migration.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Conferir e gravar pacote de migracao
        shell: bash
        run: |
          echo "Arquivos alterados:"
          git status --short
          echo "Referencias remanescentes ao dominio antigo:"
          grep -R "https://gerador-de-cronograma-mpc.netlify.app" --exclude-dir=.git . || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migra SEO e portal para lucasmpc.com.br"
          git push origin HEAD:migracao-lucasmpc-20260917
