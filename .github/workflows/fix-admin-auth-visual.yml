name: Corrigir visual da entrada administrativa

on:
  push:
    branches:
      - agent/limpar-cabecalho-admin
    paths:
      - scripts/fix_admin_auth_visual.py
      - .github/workflows/fix-admin-auth-visual.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/limpar-cabecalho-admin
      - name: Aplicar correção visual
        run: python scripts/fix_admin_auth_visual.py
      - name: Validar CSS
        run: |
          grep -q 'Autenticação administrativa: identidade limpa desde a entrada' admin-enhancements.css
          grep -q '#adminAuthModal .modal' admin-enhancements.css
          grep -q 'body:not(.admin-view) .header-actions' admin-enhancements.css
      - name: Commitar correção
        run: |
          if git diff --quiet; then
            echo 'Sem alterações.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-enhancements.css
          git commit -m 'Corrigir visual da entrada administrativa'
          git push origin HEAD:agent/limpar-cabecalho-admin
