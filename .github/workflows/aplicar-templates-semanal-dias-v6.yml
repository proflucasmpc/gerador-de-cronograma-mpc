name: Aplicar templates semanal e por dias v6
on:
  push:
    branches:
      - agent/correcao-pdfs-personalizacao-v3
    paths:
      - '.github/scripts/patch-templates-semanal-dias-v6.py'
      - '.github/workflows/aplicar-templates-semanal-dias-v6.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correcao-pdfs-personalizacao-v3
      - name: Aplicar templates
        run: python .github/scripts/patch-templates-semanal-dias-v6.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/app.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Validar templates
        run: |
          grep -q "function pdfTemplateFamily" index.html
          grep -q "policial_feminino" index.html
          grep -q "policial_masculino" index.html
          grep -q "vestibular_feminino" index.html
          grep -q "vestibular_masculino" index.html
          grep -q "premium_minimalista" index.html
          grep -q "for(let i=0;i<days.length;i+=2)" index.html
          grep -q "PLANEJAMENTO SEMANAL · SEMANA" index.html
          grep -q "pdfDrawTemplateDayPanel" index.html
      - name: Limpar arquivos temporários
        run: rm -f .github/scripts/patch-templates-semanal-dias-v6.py .github/workflows/aplicar-templates-semanal-dias-v6.yml
      - name: Commit
        run: |
          git config user.name 'proflucasmpc'
          git config user.email 'matematecnica@gmail.com'
          git add -A
          git commit -m 'feat: aplicar templates premium aos PDFs semanal e por dias' || exit 0
          git push origin HEAD:agent/correcao-pdfs-personalizacao-v3
