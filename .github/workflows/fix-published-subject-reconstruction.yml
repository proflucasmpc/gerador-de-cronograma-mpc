name: Corrigir reconstrucao de materias publicadas
on:
  push:
    paths:
      - '.github/workflows/fix-published-subject-reconstruction.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correcao
        run: python .github/scripts/fix_published_subject_reconstruction.py
      - name: Validar JavaScript
        run: node --check admin-enhancements.js
      - name: Confirmar recuperacao de topicos
        run: |
          grep -q "const taskNames" admin-enhancements.js
          grep -q "if(!topics.length)return" admin-enhancements.js
          grep -q "admin-enhancements.js?v=20260813-1" admin.html
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-enhancements.js admin.html
          git commit -m "Fix reconstruction of old published plan subjects"
          git push
