name: Aplicar PDF mobile e logo opcional v5
on:
  push:
    branches:
      - agent/correcao-pdfs-personalizacao-v3
    paths:
      - '.github/scripts/patch-pdf-mobile-logo-v5.py'
      - '.github/workflows/aplicar-pdf-mobile-logo-v5.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correcao-pdfs-personalizacao-v3
      - name: Aplicar correções
        run: python .github/scripts/patch-pdf-mobile-logo-v5.py
      - name: Validar JavaScript principal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          assert scripts, 'nenhum script encontrado'
          Path('/tmp/app.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Validar recursos novos
        run: |
          grep -q 'adminPdfLogoEnabled' index.html
          grep -q 'adminPdfLogoUpload' index.html
          grep -q 'pdfDrawOptionalLogo' index.html
          grep -q 'for(let i=0;i<days.length;i+=2)' index.html
          grep -q 'PDF_PAGE.width=595.28' index.html
          grep -q 'PDF_PAGE.height=841.89' index.html
      - name: Remover arquivos temporários
        run: rm -f .github/scripts/patch-pdf-mobile-logo-v5.py .github/workflows/aplicar-pdf-mobile-logo-v5.yml
      - name: Commit da atualização
        run: |
          git config user.name 'proflucasmpc'
          git config user.email 'matematecnica@gmail.com'
          git add -A
          git commit -m 'feat: PDF mobile com dois dias e logo opcional' || exit 0
          git push origin HEAD:agent/correcao-pdfs-personalizacao-v3
