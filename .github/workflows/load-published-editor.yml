name: Carregar cronograma publicado no editor
on:
  push:
    paths:
      - '.github/workflows/load-published-editor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar melhoria
        run: python .github/scripts/patch_load_published_editor.py
      - name: Validar JavaScript
        run: |
          node --check admin-enhancements.js
          node --check admin-study-routine.js
      - name: Confirmar proteções
        run: |
          grep -q "Carregar no editor" admin-enhancements.js
          grep -q "Proteção contra troca de aluno" admin-enhancements.js
          grep -q "Editando página publicada" admin-enhancements.js
          grep -q "admin-enhancements.js?v=20260812-6" admin.html
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-enhancements.js admin.html
          git commit -m "Add safe published plan loading to admin editor"
          git push
