name: Aplicar captura WhatsApp v16

on:
  push:
    branches:
      - agent/captura-codigo-whatsapp-inicial
    paths:
      - '.github/scripts/patch-captura-whatsapp-v16.py'
      - '.github/workflows/aplicar-captura-whatsapp-v16.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/captura-codigo-whatsapp-inicial
          fetch-depth: 0
      - name: Aplicar patch
        run: python .github/scripts/patch-captura-whatsapp-v16.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          inline=[b for b in blocks if 'const STORAGE_KEY' in b]
          if not inline:
              raise SystemExit('script principal não encontrado')
          Path('/tmp/app.js').write_text(inline[0],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Validar novo fluxo
        run: |
          grep -q "Para usar o Gerador de Cronogramas MPC GRATUITAMENTE" index.html
          grep -q "Meu nome é:" index.html
          grep -q "function platformAccessRequired(){ return !adminUnlocked() && !state.registered; }" index.html
          grep -q "accessNameInput" index.html
          grep -q "submitRegistrationToNetlify(form)" index.html
      - name: Limpar temporários
        run: |
          rm -f .github/scripts/patch-captura-whatsapp-v16.py
          rm -f .github/workflows/aplicar-captura-whatsapp-v16.yml
      - name: Commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/patch-captura-whatsapp-v16.py .github/workflows/aplicar-captura-whatsapp-v16.yml
          git commit -m "feat: solicitar código pelo WhatsApp antes de liberar o gerador"
          git push origin HEAD:agent/captura-codigo-whatsapp-inicial
