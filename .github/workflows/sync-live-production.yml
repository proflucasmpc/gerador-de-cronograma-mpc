    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/premium-pdf.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Migração permanente: qualquer URL antiga do subdomínio Netlify mantém o mesmo caminho no domínio definitivo.
[[redirects]]
  from = "https://gerador-de-cronograma-mpc.netlify.app/*"
  to = "https://lucasmpc.com.br/:splat"
  status = 301
  force = true

