name: Sync live production snapshot
on:
  push:
    branches: [sync-work-20260919]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-work-20260919
          fetch-depth: 0
      - name: Download current production files
        shell: bash
        run: |
          set -euo pipefail
          base="https://lucasmpc.com.br"
          files=(
            "index.html"
            "sitemap.xml"
            "como-dividir-materias-do-edital.html"
            "como-montar-cronograma-de-estudos-para-concurso.html"
            "cronograma-de-estudos-12x36.html"
            "cronograma-de-estudos-2-horas-por-dia.html"
            "cronograma-de-estudos-para-concurso.html"
            "cronograma-de-estudos-para-quem-trabalha.html"
            "gerador-de-cronograma-de-estudos-para-concurso.html"
            "guias-de-estudo-para-concursos.html"
            "plano-de-estudos-a-partir-do-edital.html"
            "vantagens-de-estudar-com-cronograma.html"
            "home-enhancements.css"
            "home-enhancements.js"
            "politica-de-privacidade.html"
            "portal-pages.css"
            "portal-pages.js"
            "produto.css"
            "produto.html"
            "produto.js"
            "termos-de-uso.html"
            "assets/brand/mpc-mark.svg"
            "assets/brand/prof-lucas-mpc.webp"
            "assets/brand/professor-lucas-mpc-logo.svg"
            "assets/club/80-simulados.webp"
            "assets/club/academia.webp"
            "assets/club/banner-academia.webp"
            "assets/club/banner-radar.webp"
            "assets/club/banner.webp"
            "assets/club/combo-estrategia.webp"
            "assets/club/combo-matematica.webp"
            "assets/club/como-passar.webp"
            "assets/club/cronograma.webp"
            "assets/club/guias.webp"
            "assets/club/interpretacao.webp"
            "assets/club/manual-chute.webp"
            "assets/club/metodo-ia.webp"
            "assets/club/portugues.webp"
          )
          for p in "${files[@]}"; do
            mkdir -p "$(dirname "$p")"
            curl -fsSL --retry 3 --retry-delay 2 "$base/$p" -o "$p"
          done

          cat > .gitignore <<'EOF'
# Local Netlify project state
.netlify/
EOF

          cat > _headers <<'EOF'
