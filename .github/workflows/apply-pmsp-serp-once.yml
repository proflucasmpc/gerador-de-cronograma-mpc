name: Apply PM-SP SERP once

on:
  push:
    branches:
      - seo/pmsp-serp-20260924
    paths:
      - scripts/apply_pmsp_serp_once.py
      - .github/workflows/apply-pmsp-serp-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/pmsp-serp-20260924
      - name: Apply PM-SP SEO updates
        run: python scripts/apply_pmsp_serp_once.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add correcao-pmsp-2026/index.html
          git commit -m "SEO: reforça gabarito, prova PDF e redação PM-SP [skip ci]"
          git push origin HEAD:seo/pmsp-serp-20260924
