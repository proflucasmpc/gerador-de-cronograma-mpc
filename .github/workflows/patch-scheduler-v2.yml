name: Corrigir distribuicao pedagogica v2
on:
  push:
    paths:
      - '.github/workflows/patch-scheduler-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Distribuir revisoes ao longo do cronograma
        run: python .github/scripts/fix_review_distribution.py
      - name: Validar JavaScript
        run: |
          node --check admin-study-routine.js
          node --check admin-enhancements.js
      - name: Confirmar regras
        run: |
          grep -q "continuousSessionPreserved:config.mode==='continuous'" admin-study-routine.js
          grep -q "repairTheoryBeforeExerciseByTopic:true" admin-study-routine.js
          grep -q "routineReviewsDistributed:true" admin-study-routine.js
          grep -q "capacityIsCeiling:true" admin-study-routine.js
          grep -q "preferredMaxNewTheoryTopicsPerDay:2" admin-study-routine.js
          grep -q "scheduleReviews(actualReviewItems,actualSlots,'')" admin-study-routine.js
          grep -q "const sequencedUnits=\[...allUnits\]" admin.html
          grep -q "const sequenceError=distribute(sequencedUnits,contentDates)" admin.html
          grep -q "admin-study-routine.js?v=20260820-1" admin-enhancements.js
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html admin-study-routine.js admin-enhancements.js
          git commit -m "Distribute reviews throughout study plan"
          git push
