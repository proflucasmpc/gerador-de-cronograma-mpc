name: Apply site analytics once

on:
  push:
    branches:
      - seo/analytics-measurement-20260924
    paths:
      - scripts/apply_site_analytics_once.py
      - site-analytics.js
      - .github/workflows/apply-site-analytics-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/analytics-measurement-20260924
      - name: Apply analytics loader to public canonical pages
        run: python scripts/apply_site_analytics_once.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-analytics.js '*.html' '**/*.html'
          git commit -m "analytics: instrumenta páginas públicas [skip ci]"
          git push origin HEAD:seo/analytics-measurement-20260924
