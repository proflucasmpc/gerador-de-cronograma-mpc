name: Aplicar visibilidade dos controles administrativos v9
on:
  push:
    paths:
      - '.github/workflows/aplicar-admin-controls-visibility-v9.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correcao-pdfs-personalizacao-v3
      - name: Aplicar patch
        run: python .github/scripts/patch-admin-controls-visibility-v9.py
      - name: Validar regra de visibilidade
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "if(entry) entry.hidden=!adminRoute||adminUnlocked();" in s
          assert "if(switcher) switcher.hidden=!adminRoute||!adminUnlocked();" in s
          print('VISIBILIDADE_OK')
          PY
      - name: Limpar arquivos temporários
        run: rm -f .github/scripts/patch-admin-controls-visibility-v9.py .github/workflows/aplicar-admin-controls-visibility-v9.yml
      - name: Commit final
        run: |
          git config user.name "proflucasmpc"
          git config user.email "matematecnica@gmail.com"
          git add index.html .github/scripts/patch-admin-controls-visibility-v9.py .github/workflows/aplicar-admin-controls-visibility-v9.yml
          git commit -m "fix: ocultar controles administrativos da área pública"
          git push origin agent/correcao-pdfs-personalizacao-v3