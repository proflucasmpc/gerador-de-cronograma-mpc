name: Apply large edital scheduler fix

on:
  push:
    branches: [fix/large-edict-scheduler]
    paths: ['.github/workflows/apply-large-edict-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/large-edict-scheduler
      - name: Patch scheduler
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')

          old="""    function adminDaysBetweenKeys(a,b){
      if(!a||!b) return Infinity;
      const da=dateFromKey(a), db=dateFromKey(b);
      if(!da||!db) return Infinity;
      return Math.abs(calendarDaysBetween(da,db)-1);
    }
"""
          new="""    function adminDaysBetweenKeys(a,b){
      if(!a||!b) return Infinity;
      const da=dateFromKey(a), db=dateFromKey(b);
      if(!da||!db) return Infinity;
      return Math.round((db-da)/86400000);
    }
"""
          assert s.count(old)==1, 'adminDaysBetweenKeys block not found uniquely'
          s=s.replace(old,new)

          old="""    function adminSubjectQueues(draft){
      return draft.subjects.map(subject=>{
        const name=String(subject.name||'').trim();
        const topics=parseAdminTopicsText(subject.topicsText);
        const duration=Math.max(5,Number(subject.sessionMinutes)||draft.sessionMinutes);
        const units=[];
        const reviewBuffer=[];
        topics.forEach((topic,index)=>{
          if(draft.includeTheory) units.push({subject:name,topic,type:'Teoria',stage:0,activity:`Teoria - ${topic}`,duration});
          if(draft.includeExercises) units.push({subject:name,topic,type:'Exercícios',stage:1,activity:`Exercícios - ${topic}`,duration});
          reviewBuffer.push(topic);
          if(draft.includeReviews && (reviewBuffer.length===3 || index===topics.length-1)){
            units.push({
              subject:name,
              topic:reviewBuffer.join(', '),
              type:'Revisão',
              stage:2,
              activity:`Revisão - ${reviewBuffer.join(', ')}`,
              duration
            });
            reviewBuffer.length=0;
          }
        });
        return {subject,topics,units};
      });
    }
"""
          new="""    function adminSubjectQueues(draft){
      return draft.subjects.map(subject=>{
        const name=String(subject.name||'').trim();
        const topics=parseAdminTopicsText(subject.topicsText);
        const duration=Math.max(5,Number(subject.sessionMinutes)||draft.sessionMinutes);
        const units=[];
        const reviewBuffer=[];

        // Editais extensos costumam trazer muitos microtópicos. Eles continuam
        // individualmente visíveis, mas até dois microtópicos relacionados podem
        // compartilhar a mesma sessão. Isso evita transformar cada linha do edital
        // em uma sessão inteira e preserva a preferência pedagógica de no máximo
        // dois novos microtópicos por bloco de teoria.
        const topicGroups=[];
        for(let index=0;index<topics.length;index+=2) topicGroups.push(topics.slice(index,index+2));

        topicGroups.forEach((group,index)=>{
          const topic=group.join(' · ');
          const topicCount=group.length;
          if(draft.includeTheory) units.push({subject:name,topic,topics:[...group],topicCount,type:'Teoria',stage:0,activity:`Teoria - ${topic}`,duration});
          if(draft.includeExercises) units.push({subject:name,topic,topics:[...group],topicCount,type:'Exercícios',stage:1,activity:`Exercícios - ${topic}`,duration});
          reviewBuffer.push(...group);
          if(draft.includeReviews && (reviewBuffer.length>=6 || index===topicGroups.length-1)){
            const reviewed=reviewBuffer.splice(0,reviewBuffer.length);
            units.push({
              subject:name,
              topic:reviewed.join(', '),
              topics:reviewed,
              topicCount:reviewed.length,
              type:'Revisão',
              stage:2,
              activity:`Revisão - ${reviewed.join(', ')}`,
              duration
            });
          }
        });
        return {subject,topics,units};
      });
    }
"""
          assert s.count(old)==1, 'adminSubjectQueues block not found uniquely'
          s=s.replace(old,new)

          old="""      const availableMinutes=studyDates.length*Math.round(draft.hoursPerDay*60);
      const requiredMinutes=units.reduce((sum,unit)=>sum+unit.duration,0)+Math.max(0,units.length-studyDates.length)*10;
      const diagnostics=adminDistributionDiagnostics(units);
      return {window,queues,units,simDates,simKeys,studyDates,availableMinutes,requiredMinutes,diagnostics,examEveProtected,examEveKey};
"""
          new="""      const reservedCount=adminReservedReviewDays(draft,window);
      const regularStudyDates=reservedCount
        ? studyDates.filter(date=>calendarDaysBetween(date,window.end)>reservedCount)
        : [...studyDates];
      const contentStudyDates=regularStudyDates.length?regularStudyDates:studyDates;
      const availableMinutes=contentStudyDates.length*Math.round(draft.hoursPerDay*60);
      const requiredMinutes=units.reduce((sum,unit)=>sum+unit.duration,0)+Math.max(0,units.length-contentStudyDates.length)*10;
      const diagnostics=adminDistributionDiagnostics(units);
      return {window,queues,units,simDates,simKeys,studyDates,contentStudyDates,availableMinutes,requiredMinutes,diagnostics,examEveProtected,examEveKey};
"""
          assert s.count(old)==1, 'adminSchedulePreview capacity block not found uniquely'
          s=s.replace(old,new)

          old="""      const allStudyDates=[...preview.studyDates];
      if(!allStudyDates.length) return {error:'Não há dias de estudo disponíveis no período selecionado.'};

      const reservedCount=adminReservedReviewDays(draft,preview.window);
      const regularDates=reservedCount
        ? allStudyDates.filter(date=>calendarDaysBetween(date,preview.window.end)>reservedCount)
        : [...allStudyDates];
      const finalDates=reservedCount
        ? allStudyDates.filter(date=>calendarDaysBetween(date,preview.window.end)<=reservedCount)
        : [];
      const contentDates=regularDates.length?regularDates:allStudyDates;
"""
          new="""      const allStudyDates=[...preview.studyDates];
      if(!allStudyDates.length) return {error:'Não há dias de estudo disponíveis no período selecionado.'};

      const oversized=allUnits.find(unit=>unit.duration>dailyLimit);
      if(oversized){
        return {error:`A sessão de ${oversized.subject} tem ${oversized.duration} minutos, acima do limite diário de ${dailyLimit} minutos. Reduza apenas a duração dessa sessão ou ajuste a rotina; aumentar o número de dias não resolve essa incompatibilidade.`};
      }

      const reservedCount=adminReservedReviewDays(draft,preview.window);
      const regularDates=reservedCount
        ? allStudyDates.filter(date=>calendarDaysBetween(date,preview.window.end)>reservedCount)
        : [...allStudyDates];
      const finalDates=reservedCount
        ? allStudyDates.filter(date=>calendarDaysBetween(date,preview.window.end)<=reservedCount)
        : [];
      const contentDates=Array.isArray(preview.contentStudyDates)&&preview.contentStudyDates.length
        ? [...preview.contentStudyDates]
        : (regularDates.length?regularDates:allStudyDates);
"""
          assert s.count(old)==1, 'adminBuildStudyTasks date block not found uniquely'
          s=s.replace(old,new)

          old="""      label.textContent=`Período: ${preview.window.days} dias corridos, ${preview.studyDates.length} dias de estudo e ${preview.simDates.length} dias exclusivos de simulado. Capacidade aproximada: ${formatHours(preview.availableMinutes)}; atividades previstas: ${preview.units.length}, com cerca de ${formatHours(preview.requiredMinutes)}.${reserved?` As revisões normais serão distribuídas ao longo do ciclo; os últimos ${reserved} dia(s) serão protegidos para reta final, questões e simulados.`:''}${preview.examEveProtected?' O simulado completo que cairia na véspera da prova será substituído automaticamente por preparação leve.':''}${fits?' O plano cabe no período e será distribuído ao longo das datas disponíveis.':' O plano não cabe no período com as configurações atuais.'}`;
"""
          new="""      label.textContent=`Período efetivo: ${preview.window.days} dias corridos, ${preview.studyDates.length} dias de estudo e ${preview.simDates.length} dias exclusivos de simulado.${preview.window.capped?' A quantidade digitada foi limitada automaticamente à véspera da prova.':''} Capacidade real para conteúdo antes da reta final: ${formatHours(preview.availableMinutes)}; atividades previstas: ${preview.units.length}, com cerca de ${formatHours(preview.requiredMinutes)}.${reserved?` As revisões normais serão distribuídas ao longo do ciclo; os últimos ${reserved} dia(s) serão protegidos para reta final, questões e simulados.`:''}${preview.examEveProtected?' O simulado completo que cairia na véspera da prova será substituído automaticamente por preparação leve.':''}${fits?' O plano cabe no período e será distribuído ao longo das datas disponíveis.':' O plano não cabe no período com as configurações atuais.'}`;
"""
          assert s.count(old)==1, 'capacity preview text block not found uniquely'
          s=s.replace(old,new)

          # Self-checks for the intended invariants.
          assert 'for(let index=0;index<topics.length;index+=2)' in s
          assert 'const oversized=allUnits.find(unit=>unit.duration>dailyLimit);' in s
          assert 'contentStudyDates' in s
          assert 'return Math.round((db-da)/86400000);' in s
          p.write_text(s,encoding='utf-8')
      - name: Validate patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('admin.html').read_text(encoding='utf-8')
          checks={
            'microtopic grouping':'topicGroups.push(topics.slice(index,index+2))',
            'real capacity':'contentStudyDates.length*Math.round(draft.hoursPerDay*60)',
            'oversized session':'A sessão de ${oversized.subject}',
            'forward spacing':'Math.round((db-da)/86400000)',
            'effective window':'Período efetivo:'
          }
          missing=[name for name,text in checks.items() if text not in s]
          if missing: raise SystemExit('Missing checks: '+', '.join(missing))
          print('Scheduler patch validated:', ', '.join(checks))
          PY
      - name: Commit patched scheduler and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-large-edict-fix.yml
          git add -- admin.html
          git commit -m "Fix large edital scheduling"
          git push origin HEAD:fix/large-edict-scheduler
