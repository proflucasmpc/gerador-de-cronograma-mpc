name: Aplicar resumo inteligente admin v8
on:
  push:
    paths:
      - '.github/workflows/aplicar-admin-insights-v8.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correcao-pdfs-personalizacao-v3
      - name: Aplicar patch
        run: python .github/scripts/patch-admin-insights-v8.py
      - name: Validar JavaScript básico
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['adminInsightsCard','adminRefreshInsightsBtn','buildInsightsMarkup','renderInsights()']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Faltando: '+', '.join(missing))
          print('VALIDATION_OK')
          PY
      - name: Limpar arquivos temporários
        run: rm -rf .github/scripts/patch-admin-insights-v8.py .github/workflows/aplicar-admin-insights-v8.yml
      - name: Commit final
        run: |
          git config user.name "proflucasmpc"
          git config user.email "matematecnica@gmail.com"
          git add -A
          git commit -m "feat: adicionar resumo inteligente na área administrativa"
          git push origin HEAD:agent/correcao-pdfs-personalizacao-v3
