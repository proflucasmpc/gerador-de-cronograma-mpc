name: Aplicar correção resumo inteligente admin v12

on:
  push:
    branches:
      - agent/corrigir-resumo-inteligente-admin
    paths:
      - '.github/workflows/aplicar-admin-smart-summary-v12.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corrigir-resumo-inteligente-admin
      - name: Aplicar patch
        run: python .github/scripts/patch-admin-smart-summary-v12.py
      - name: Validar JavaScript básico
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('nenhum script encontrado')
          js='\n'.join(scripts)
          p=Path('/tmp/check.js'); p.write_text(js,encoding='utf-8')
          subprocess.run(['node','--check',str(p)],check=True)
          required=['function renderAdminInsights(showFeedback=false)','adminSchedulePreview(draft)','adminBuildStudyTasks(draft,preview)',"adminRefreshInsightsBtn')) el('adminRefreshInsightsBtn').onclick=()=>renderAdminInsights(true)"]
          for item in required:
              if item not in s:
                  raise SystemExit(f'validação ausente: {item}')
          print('VALIDACAO_OK')
          PY
      - name: Limpar arquivos temporários
        run: rm -rf .github/scripts .github/workflows/aplicar-admin-smart-summary-v12.yml
      - name: Commit final
        run: |
          git config user.name "proflucasmpc"
          git config user.email "matematecnica@gmail.com"
          git add index.html .github
          git commit -m "fix: recalcular resumo inteligente na area administrativa"
          git push origin agent/corrigir-resumo-inteligente-admin
