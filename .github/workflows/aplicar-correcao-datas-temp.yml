name: Aplicar correção de datas temporária
on:
  push:
    branches:
      - agent/corrigir-resumo-inteligente-admin
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[skip-patch-datas]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corrigir-resumo-inteligente-admin
      - name: Aplicar patch
        run: python .github/scripts/patch-algoritmo-datas-v13.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Validar regras principais
        run: |
          grep -q 'adminReservedReviewDays' index.html
          grep -q 'adminCanPlaceUnitOnDate' index.html
          grep -q 'será distribuído ao longo das datas disponíveis' index.html
      - name: Limpar arquivos temporários
        run: |
          rm -f .github/scripts/patch-algoritmo-datas-v13.py
          rm -f .github/workflows/aplicar-correcao-datas-temp.yml
      - name: Commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts .github/workflows
          git commit -m "fix: distribuir cronograma pelo período e separar etapas [skip-patch-datas]"
          git push origin HEAD:agent/corrigir-resumo-inteligente-admin
