name: Aplicar restauração de simulados temporária
on:
  push:
    branches:
      - agent/corrigir-resumo-inteligente-admin
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[skip-patch-sim]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corrigir-resumo-inteligente-admin
      - name: Aplicar patch
        run: python .github/scripts/patch-restaurar-simulados-v14.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Validar regras
        run: |
          grep -q 'preview.simDates.forEach' index.html
          grep -q 'adminReservedReviewDays' index.html
          grep -q 'adminCanPlaceUnitOnDate' index.html
      - name: Limpar temporários
        run: |
          rm -f .github/scripts/patch-restaurar-simulados-v14.py
          rm -f .github/workflows/aplicar-simulados-temp.yml
      - name: Commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts .github/workflows
          git commit -m "fix: restaurar simulados no novo agendador [skip-patch-sim]"
          git push origin HEAD:agent/corrigir-resumo-inteligente-admin
