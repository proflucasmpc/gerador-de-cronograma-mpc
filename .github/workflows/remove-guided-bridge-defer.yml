name: Remover flash da tela antiga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-guided-bridge-defer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar redirecionamento antes da renderização
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text('utf-8')
          old='<script src="/guided-bridge.js" defer></script>'
          new='<script src="/guided-bridge.js"></script>'
          if old not in s:
              if new in s:
                  print('Correção já aplicada.')
              else:
                  raise SystemExit('Tag guided-bridge.js não encontrada.')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,'utf-8')
          PY

      - name: Validar preservação administrativa
        run: |
          grep -q '<script src="/guided-bridge.js"></script>' index.html
          ! grep -q '<script src="/guided-bridge.js" defer></script>' index.html
          grep -q "params.get('admin')==='1'" guided-bridge.js
          grep -q "location.replace('/area-usuario.html')" guided-bridge.js
          node --check guided-bridge.js

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Eliminar flash da tela antiga antes da área guiada"
          git push origin HEAD:main
