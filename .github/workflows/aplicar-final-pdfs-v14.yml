name: Aplicar correções finais PDFs v14
on:
  push:
    paths:
      - '.github/workflows/aplicar-final-pdfs-v14.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch-final-pdfs-v14.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Validar regras
        run: |
          grep -q "DIA DA PROVA" index.html
          grep -q "Data sugerida:" index.html
          grep -q "{tipo_cronograma}" index.html
          grep -q "window.exam||key!==localDateKey(window.exam)" index.html
          grep -q "pdfWrapText(activity,contentW-18,font,8,false)" index.html
      - name: Limpar temporários
        run: |
          rm -f .github/scripts/patch-final-pdfs-v14.py
          rm -f .github/workflows/aplicar-final-pdfs-v14.yml
      - name: Commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: corrigir dia da prova, ciclos e textos dos PDFs" || exit 0
          git push
