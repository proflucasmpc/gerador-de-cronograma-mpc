name: Aplicar template final da página do aluno

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-plan-template.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar HTML final aprovado e logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          html_b64 = ''''''
          logo_b64 = ''''''
          Path('plano.html').write_bytes(gzip.decompress(base64.b64decode(html_b64)))
          Path('assets').mkdir(exist_ok=True)
          Path('assets/logo-mpc.jpg').write_bytes(gzip.decompress(base64.b64decode(logo_b64)))
          PY

      - name: Validar página final
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('plano.html').read_text(encoding='utf-8')
          assert 'mentoria-fixed' in text
          assert 'Raio-X do conteúdo' in text
          assert 'Mapa de matérias e conteúdos' in text
          assert 'Cronograma de execução' in text
          assert 'PREVIEW_MS=60000' in text
          assert '/api/plans' in text
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',text,re.S)
          Path('/tmp/plano-main.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/plano-main.js
          test -s assets/logo-mpc.jpg
          git diff --check

      - name: Publicar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plano.html assets/logo-mpc.jpg
          git commit -m "Aplicar template premium final à página compartilhada"
          git push origin HEAD:main
