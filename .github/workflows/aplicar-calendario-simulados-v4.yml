name: Aplicar calendario e simulados v4
on:
  push:
    branches:
      - agent/correcao-pdfs-personalizacao-v3
    paths:
      - '.github/scripts/patch-calendario-simulados-v4.py'
      - '.github/workflows/aplicar-calendario-simulados-v4.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correcao-pdfs-personalizacao-v3
      - name: Aplicar correções
        run: python .github/scripts/patch-calendario-simulados-v4.py
      - name: Validar JavaScript principal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          assert scripts, 'nenhum script encontrado'
          Path('/tmp/app.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Validar recursos novos
        run: |
          grep -q 'adminSimulationAllWeekdays' index.html
          grep -q 'adminSimulationWeekdays' index.html
          grep -q 'Simulado por matéria' index.html
          grep -q 'CALENDÁRIO POR QUANTIDADE DE DIAS' index.html
          grep -q 'pdfDrawPoliceShield' index.html
          grep -q 'PDF_PAGE.width=841.89' index.html
      - name: Remover arquivos temporários
        run: rm -f .github/scripts/patch-calendario-simulados-v4.py .github/workflows/aplicar-calendario-simulados-v4.yml
      - name: Commit da atualização
        run: |
          git config user.name 'proflucasmpc'
          git config user.email 'matematecnica@gmail.com'
          git add -A
          git commit -m 'feat: calendário real e simulados flexíveis' || exit 0
          git push origin HEAD:agent/correcao-pdfs-personalizacao-v3
