name: Apply Assuntos Vunesp links once

on:
  push:
    branches:
      - seo/assuntos-matematica-vunesp-20260924
    paths:
      - scripts/apply_assuntos_vunesp_links_once.py
      - .github/workflows/apply-assuntos-vunesp-links-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/assuntos-matematica-vunesp-20260924
      - name: Apply sitemap and internal link
        run: python scripts/apply_assuntos_vunesp_links_once.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml como-estudar-matematica-para-vunesp/index.html
          git commit -m "SEO: conecta guia de assuntos Vunesp [skip ci]"
          git push origin HEAD:seo/assuntos-matematica-vunesp-20260924
