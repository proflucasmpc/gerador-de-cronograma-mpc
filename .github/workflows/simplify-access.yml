name: Simplificar acesso manual

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/simplify-access.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar alteração
        run: python scripts/simplify_access.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          start=text.find('  <script>\n  (() => {')
          end=text.find('  })();\n  </script>', start)
          if start < 0 or end < 0:
              raise SystemExit('script principal não encontrado')
          Path('/tmp/main.js').write_text(text[start+len('  <script>\n'):end+len('  })();')],encoding='utf-8')
          PY
          node --check /tmp/main.js
          git diff --check
      - name: Publicar no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplificar acesso para código manual de 6 caracteres"
          git push origin HEAD:main
