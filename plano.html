<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<title>Plano de Estudos · Professor Lucas MPC</title>
<style>
:root{--navy:#071427;--navy2:#102540;--cyan:#36c8ea;--gold:#d8aa2e;--purple:#775de5;--green:#25b987;--orange:#f1a33b;--bg:#f4f7fb;--card:#fff;--text:#182235;--muted:#667085;--line:#dfe5ec}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}a{color:inherit}.top{background:linear-gradient(135deg,var(--navy),#102b4d 70%,#16355a);color:#fff;padding:28px 18px 72px}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.brand{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand strong{font-size:17px}.brand small{display:block;color:#b6c5d8;margin-top:4px}.badge{background:var(--gold);color:var(--navy);font-weight:900;border-radius:999px;padding:8px 12px;font-size:11px}.hero{margin-top:54px;display:grid;grid-template-columns:1.4fr .6fr;gap:26px;align-items:end}.eyebrow{color:var(--cyan);font-weight:900;font-size:12px;letter-spacing:.08em}.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(34px,6vw,62px);line-height:1.02;margin:10px 0 15px}.hero p{color:#c8d3e2;font-size:16px;line-height:1.65;max-width:760px}.student-card{background:#ffffff12;border:1px solid #ffffff24;border-radius:18px;padding:20px}.student-card small{color:var(--cyan);font-weight:900}.student-card strong{display:block;font-family:Georgia,'Times New Roman',serif;font-size:22px;margin:7px 0}.main{margin-top:-42px;padding-bottom:60px}.grid-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 35px #10254010}.metric strong{font-family:Georgia,'Times New Roman',serif;font-size:28px;color:var(--navy)}.metric span{display:block;margin-top:6px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.section{margin-top:30px}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:14px}.section h2{font-family:Georgia,'Times New Roman',serif;color:var(--navy);font-size:28px;margin:0}.section-head p{margin:0;color:var(--muted);font-size:13px}.subject-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.subject{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;display:flex;justify-content:space-between;gap:14px}.subject b{font-size:14px}.subject span{color:var(--muted);font-size:12px}.timeline{display:grid;gap:16px}.day{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.day-head{background:var(--navy);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;gap:15px;align-items:center}.day-head small{color:var(--cyan);display:block;font-weight:900;text-transform:uppercase;font-size:10px}.day-head strong{font-family:Georgia,'Times New Roman',serif;font-size:20px}.day-head em{font-style:normal;color:var(--gold);font-size:11px;font-weight:900}.task{display:grid;grid-template-columns:112px 1fr;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.pill{height:28px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 11px;font-size:10px;font-weight:900;color:#fff}.teoria{background:var(--cyan)}.exercicios{background:var(--purple)}.revisao{background:var(--green)}.simulado{background:var(--orange);color:var(--navy)}.estudo{background:#46627f}.task b{display:block;font-size:13px;margin-bottom:5px}.task p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.floating{position:fixed;right:20px;bottom:20px;background:#25d366;color:#082815;text-decoration:none;padding:13px 16px;border-radius:999px;font-weight:900;box-shadow:0 12px 30px #0003;z-index:30}.cta{margin-top:36px;background:var(--navy);color:#fff;border-radius:20px;padding:26px}.cta h3{font-family:Georgia,'Times New Roman',serif;font-size:26px;margin:0 0 8px}.cta p{color:#c3cfdd;line-height:1.6}.cta a{display:inline-block;margin-top:8px;background:var(--gold);color:var(--navy);text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:900}.state{width:min(680px,calc(100% - 30px));margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center}.state h1{font-family:Georgia,'Times New Roman',serif;color:var(--navy)}.footer{padding:32px 18px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid-metrics{grid-template-columns:repeat(2,1fr)}.subject-grid{grid-template-columns:1fr}.task{grid-template-columns:1fr}.pill{width:max-content}.section-head{align-items:start;flex-direction:column}.floating{right:12px;bottom:12px}}
</style>
</head>
<body>
<div id="app"><div class="state"><h1>Carregando plano de estudos…</h1><p>Aguarde alguns segundos.</p></div></div>
<script>
(()=>{
'use strict';
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pathParts=location.pathname.split('/').filter(Boolean);const id=(pathParts.at(-1)||new URLSearchParams(location.search).get('id')||'').toUpperCase();
const ptDate=v=>{if(!v)return'—';const d=new Date(v.includes('T')?v:`${v}T12:00:00`);return Number.isNaN(d.getTime())?v:d.toLocaleDateString('pt-BR')};
const week=v=>{const d=new Date(`${v}T12:00:00`);return ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][d.getDay()]};
const typeClass=v=>{const s=String(v||'').toLowerCase();if(s.includes('simulado'))return'simulado';if(s.includes('exerc'))return'exercicios';if(s.includes('revis'))return'revisao';if(s.includes('teoria'))return'teoria';return'estudo'};
const contentLabel=t=>String(t.activity||'Atividade de estudo').replace(/^\s+/,'');
async function load(){
 if(!/^[A-Z0-9]{10}$/.test(id)) throw new Error('Link de cronograma inválido.');
 const res=await fetch(`/api/plans?id=${encodeURIComponent(id)}`,{cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Cronograma não encontrado.');return data;
}
function render(p){
 document.title=`Plano de ${p.studentName||'Estudos'} · Professor Lucas MPC`;
 const tasks=[...(p.tasks||[])].sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.start).localeCompare(String(b.start)));
 const dates=new Map();tasks.forEach(t=>{const k=t.date||'sem-data';if(!dates.has(k))dates.set(k,[]);dates.get(k).push(t)});
 const subjectCounts=new Map();tasks.forEach(t=>subjectCounts.set(t.subject||'Disciplina',(subjectCounts.get(t.subject||'Disciplina')||0)+1));
 const totalSubjects=subjectCounts.size;const reviews=tasks.filter(t=>String(t.type||'').toLowerCase().includes('revis')).length;const sims=tasks.filter(t=>String(t.type||'').toLowerCase().includes('simulado')).length;
 app.innerHTML=`
 <header class="top"><div class="wrap"><div class="brand"><div><strong>Professor Lucas MPC</strong><small>Gerador de Cronograma MPC</small></div><span class="badge">PLANO ONLINE</span></div><div class="hero"><div><div class="eyebrow">CRONOGRAMA DE ESTUDOS PERSONALIZADO</div><h1>${esc(p.goal||'Plano de estudos')}</h1><p>Seu planejamento completo para acompanhar a preparação pelo celular ou computador, com atividades organizadas por data.</p></div><div class="student-card"><small>PLANO DE</small><strong>${esc(p.studentName||'Aluno')}</strong><span>${esc(ptDate(p.startDate))} → ${esc(ptDate(p.examDate||p.endDate))}</span></div></div></div></header>
 <main class="main"><div class="wrap"><div class="grid-metrics"><div class="metric"><strong>${tasks.length}</strong><span>atividades</span></div><div class="metric"><strong>${totalSubjects}</strong><span>matérias</span></div><div class="metric"><strong>${reviews}</strong><span>revisões</span></div><div class="metric"><strong>${sims}</strong><span>simulados</span></div></div>
 <section class="section"><div class="section-head"><div><h2>Matérias do plano</h2><p>Distribuição das atividades por disciplina.</p></div></div><div class="subject-grid">${[...subjectCounts.entries()].sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<div class="subject"><b>${esc(s)}</b><span>${n} ${n===1?'atividade':'atividades'}</span></div>`).join('')}</div></section>
 <section class="section"><div class="section-head"><div><h2>Cronograma de execução</h2><p>Siga os dias em ordem e marque seu progresso na sua rotina pessoal.</p></div></div><div class="timeline">${[...dates.entries()].map(([date,items])=>`<article class="day"><div class="day-head"><div><small>${esc(date==='sem-data'?'Sem data':week(date))}</small><strong>${esc(date==='sem-data'?'Atividades':ptDate(date))}</strong></div><em>${items.length} ${items.length===1?'bloco':'blocos'}</em></div>${items.map(t=>`<div class="task"><div><span class="pill ${typeClass(t.type)}">${esc(String(t.type||'Estudo').toUpperCase())}</span></div><div><b>${esc(t.subject||'Disciplina')} ${t.start?`· ${esc(t.start)}${t.end?`–${esc(t.end)}`:''}`:''}</b><p>${esc(contentLabel(t))}</p></div></div>`).join('')}</article>`).join('')}</div></section>
 <section class="cta"><h3>Quer criar o seu próprio cronograma?</h3><p>Use gratuitamente o Gerador de Cronograma MPC e organize suas matérias, horários, revisões e simulados.</p><a href="/">Criar meu cronograma</a></section></div></main>
 <a class="floating" href="https://wa.me/5511960189699?text=${encodeURIComponent('Olá, professor Lucas MPC. Vi um cronograma online do Gerador MPC e gostaria de saber mais.')}">Falar com o Prof. Lucas</a>
 <footer class="footer">Plano online criado no Gerador de Cronograma MPC · Professor Lucas MPC</footer>`;
}
load().then(render).catch(err=>{app.innerHTML=`<div class="state"><h1>Não foi possível abrir este cronograma</h1><p>${esc(err.message)}</p><p><a href="/">Ir para o Gerador MPC</a></p></div>`});
})();
</script>
</body>
</html>
