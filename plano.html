<script>
(()=>{
'use strict';
const app=document.getElementById('app');

 <section class="final-banner"><div><span class="eyebrow">Plano de Estudos MPC</span><h2>Planejamento pronto. Agora é execução.</h2><p>Acompanhe seu planejamento por aqui, avance bloco a bloco e mantenha o foco até a data da prova.</p></div><span class="final-chip">PLANO DE ESTUDOS MPC</span></section>
 </main>
 <a class="whatsapp-float" href="${waCrono}" target="_blank" rel="noopener"><span class="whatsapp-icon">✆</span><span class="whatsapp-copy">Solicite um cronograma personalizado</span></a>
 <nav class="mobile-nav"><a href="#hoje"><span>◉</span><span>Hoje</span></a><a href="#plano"><span>▦</span><span>Plano</span></a><a href="#conteudos"><span>≡</span><span>Conteúdos</span></a><a href="#progresso"><span>◔</span><span>Progresso</span></a></nav>
 <div class="capture-lock" id="captureLock" aria-hidden="true"><section class="capture-card" role="dialog" aria-modal="true" aria-labelledby="captureTitle"><div class="capture-brand"><img src="${LOGO}" alt="Professor Lucas MPC"><strong>Professor Lucas MPC</strong></div><div class="capture-step" id="captureRequestStep"><h2 id="captureTitle">Continue visualizando este cronograma gratuitamente</h2><p class="capture-message">Quer continuar explorando todos os conteúdos e acompanhar o cronograma completo? Informe seu nome, escolha para que você está estudando e receba gratuitamente seu código de acesso pelo WhatsApp.</p><div class="capture-field"><label for="captureName">Nome</label><input class="capture-input" id="captureName" type="text" autocomplete="name" maxlength="100" placeholder="Digite seu nome"></div><fieldset class="capture-field" style="border:0;padding:0;margin-left:0;margin-right:0"><legend class="capture-legend">Você está estudando para:</legend><div class="capture-options"><label class="capture-option"><input type="radio" name="captureInterest" value="Concurso público"><span>Concurso público</span></label><label class="capture-option"><input type="radio" name="captureInterest" value="Vestibular / ENEM"><span>Vestibular / ENEM</span></label><label class="capture-option"><input type="radio" name="captureInterest" value="Outro"><span>Outro</span></label></div></fieldset><button class="capture-whatsapp" id="captureWhatsappBtn" type="button" disabled>SOLICITAR CÓDIGO GRATUITO PELO WHATSAPP</button><div class="capture-error" id="captureFormError" aria-live="polite"></div></div><div class="capture-step capture-code-wrap" id="captureCodeStep" hidden><h2>Digite o código recebido</h2><p class="capture-message">Insira o código de 6 caracteres enviado pelo Prof. Lucas MPC no WhatsApp.</p><div class="capture-field"><label for="captureCode">Código de acesso</label><input class="capture-code-input" id="captureCode" type="text" inputmode="text" maxlength="6" autocomplete="one-time-code" aria-label="Código de acesso de 6 caracteres" placeholder="Código recebido"></div><button class="capture-unlock" id="captureUnlock" type="button">LIBERAR ACESSO</button><div class="capture-error" id="captureError" aria-live="polite"></div></div></section></div><div class="capture-success" id="captureSuccess" aria-live="polite">Acesso liberado neste dispositivo.</div>`;
 function refresh(){
   const total=tasks.length;const pct=total?Math.round(done.size/total*100):0;
   const pp=document.getElementById('progressPercent'),pr=document.getElementById('progressRing');if(pp)pp.textContent=pct+'%';if(pr)pr.style.setProperty('--p',pct);
   document.querySelectorAll('[data-complete]').forEach(btn=>{const k=btn.dataset.complete,on=done.has(k);btn.classList.toggle('done',on);const card=document.querySelector(`[data-card-id="${CSS.escape(k)}"]`);if(card)card.classList.toggle('completed',on);const label=btn.querySelector('.complete-label');if(label)label.textContent=on?'Concluído':'Marcar concluído'});
   localStorage.setItem(progressKey,JSON.stringify([...done]));
 }
 document.querySelectorAll('[data-complete]').forEach(btn=>btn.addEventListener('click',()=>{const k=btn.dataset.complete;done.has(k)?done.delete(k):done.add(k);refresh()}));
 document.querySelectorAll('[data-week]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-week]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const panel=document.querySelector(`[data-week-panel="${CSS.escape(btn.dataset.week)}"]`);if(panel){panel.open=true;panel.scrollIntoView({behavior:'smooth',block:'start'})}}));
 refresh();
 const gateKey=`mpc-public-plan-unlocked:${id}`,pendingKey=`mpc-public-plan-whatsapp-pending:${id}`,profileKey=`mpc-public-plan-lead:${id}`;
 const lock=document.getElementById('captureLock'),requestStep=document.getElementById('captureRequestStep'),codeStep=document.getElementById('captureCodeStep'),nameInput=document.getElementById('captureName'),whatsappBtn=document.getElementById('captureWhatsappBtn'),formError=document.getElementById('captureFormError'),code=document.getElementById('captureCode'),unlockBtn=document.getElementById('captureUnlock'),codeError=document.getElementById('captureError'),success=document.getElementById('captureSuccess');
 const isGranted=()=>{try{return localStorage.getItem(gateKey)==='1'}catch{return false}},hasPending=()=>{try{return sessionStorage.getItem(pendingKey)==='1'}catch{return false}};
 function openGate(step='request'){if(isGranted())return;lock?.classList.add('visible');lock?.setAttribute('aria-hidden','false');document.body.classList.add('capture-open');const codeMode=step==='code';if(requestStep)requestStep.hidden=codeMode;if(codeStep)codeStep.hidden=!codeMode;setTimeout(()=>{(codeMode?code:nameInput)?.focus()},120)}
 function closeGate(){lock?.classList.remove('visible');lock?.setAttribute('aria-hidden','true');document.body.classList.remove('capture-open')}
 function selectedInterest(){return document.querySelector('input[name="captureInterest"]:checked')?.value||''}
 function updateWhatsappButton(){if(!whatsappBtn)return;const ready=(nameInput?.value.trim().length||0)>=2&&!!selectedInterest();whatsappBtn.disabled=!ready;if(ready&&formError)formError.textContent=''}
 try{const saved=JSON.parse(localStorage.getItem(profileKey)||'null');if(saved?.name&&nameInput)nameInput.value=saved.name;if(saved?.interest){const radio=[...document.querySelectorAll('input[name="captureInterest"]')].find(r=>r.value===saved.interest);if(radio)radio.checked=true}}catch{}
 updateWhatsappButton();nameInput?.addEventListener('input',updateWhatsappButton);document.querySelectorAll('input[name="captureInterest"]').forEach(r=>r.addEventListener('change',updateWhatsappButton));
 whatsappBtn?.addEventListener('click',()=>{const name=nameInput?.value.trim()||'',interest=selectedInterest();if(name.length<2||!interest){if(formError)formError.textContent='Preencha seu nome e marque uma opção para continuar.';return}const pageUrl=location.href.split('#')[0];const message=`Olá, professor Lucas! Meu nome é ${name} e vim da página ${pageUrl}.

Estou estudando para: ${interest}.

Poderia me enviar o código gratuito de acesso?`;try{localStorage.setItem(profileKey,JSON.stringify({name,interest}));sessionStorage.setItem(pendingKey,'1')}catch{}location.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`});
 function showCodeAfterReturn(){if(!isGranted()&&hasPending())openGate('code')}
 code?.addEventListener('input',()=>{code.value=code.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(codeError)codeError.textContent=''});code?.addEventListener('keydown',e=>{if(e.key==='Enter')unlockBtn?.click()});
 unlockBtn?.addEventListener('click',()=>{const v=(code?.value||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(v)){if(codeError)codeError.textContent='Digite exatamente 6 letras e/ou números.';code?.focus();return}try{localStorage.setItem(gateKey,'1');sessionStorage.removeItem(pendingKey)}catch{}closeGate();success?.classList.add('show');setTimeout(()=>success?.classList.remove('show'),2600)});
 if(!isGranted()){if(hasPending())openGate('code');else{let visibleAccumulated=0,visibleStartedAt=document.visibilityState==='visible'?performance.now():null,timer=null;const remainingMs=()=>Math.max(0,PREVIEW_MS-visibleAccumulated-(visibleStartedAt===null?0:performance.now()-visibleStartedAt));const scheduleGate=()=>{clearTimeout(timer);if(document.visibilityState!=='visible'||isGranted()||hasPending())return;const remaining=remainingMs();if(remaining<=0){openGate('request');return}timer=setTimeout(()=>openGate('request'),remaining)};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(visibleStartedAt!==null){visibleAccumulated+=performance.now()-visibleStartedAt;visibleStartedAt=null}clearTimeout(timer);return}if(hasPending()){showCodeAfterReturn();return}visibleStartedAt=performance.now();scheduleGate()});window.addEventListener('pageshow',showCodeAfterReturn);window.addEventListener('focus',()=>{if(hasPending())showCodeAfterReturn()});scheduleGate()}}

}
load().then(render).catch(err=>{app.innerHTML=`<div class="state"><h1>Não foi possível abrir este cronograma</h1><p>${esc(err.message)}</p><p><a href="/">Ir para o Gerador MPC</a></p></div>`});
})();
